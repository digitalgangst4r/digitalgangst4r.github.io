<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  {%- include head.html -%}
</head>
<body>
  <div class="site">
    {%- include header.html -%}
    <main>
      {{ content }}
    </main>
    {%- include footer.html -%}
  </div>

  <script>
  (function(){
    var root=document.documentElement, KEY='t1m3-theme';
    var btn=document.getElementById('themeToggle'),
        icon=document.getElementById('themeIcon'),
        label=document.getElementById('themeLabel');
    var order=['auto','light','dark'];
    var meta={auto:{i:'◑',t:'auto'},light:{i:'☀',t:'light'},dark:{i:'☾',t:'dark'}};
    function current(){try{var v=localStorage.getItem(KEY);return (v==='light'||v==='dark')?v:'auto';}catch(e){return 'auto';}}
    function paint(v){ if(icon)icon.textContent=meta[v].i; if(label)label.textContent=meta[v].t; if(btn)btn.setAttribute('aria-label','tema: '+meta[v].t); }
    function apply(v){
      if(v==='light'||v==='dark'){root.setAttribute('data-theme',v);} else {root.removeAttribute('data-theme');}
      try{ if(v==='auto'){localStorage.removeItem(KEY);} else {localStorage.setItem(KEY,v);} }catch(e){}
      paint(v);
    }
    paint(current());
    if(btn){ btn.addEventListener('click',function(){
      var v=current(), n=order[(order.indexOf(v)+1)%order.length]; apply(n);
    }); }
  })();
  </script>

  <script>
  (function(){
    var LKEY='t1m3-lang';
    var btn=document.getElementById('langToggle'), lbl=document.getElementById('langLabel');
    function cur(){try{return localStorage.getItem(LKEY)==='en'?'en':'pt';}catch(e){return 'pt';}}
    function apply(l){
      var nodes=document.querySelectorAll('[data-en]');
      for(var i=0;i<nodes.length;i++){ var el=nodes[i];
        if(el.getAttribute('data-pt')===null){ el.setAttribute('data-pt', el.innerHTML); }
        el.innerHTML = (l==='en') ? el.getAttribute('data-en') : el.getAttribute('data-pt');
      }
      document.documentElement.lang = (l==='en') ? 'en' : 'pt-BR';
      if(lbl) lbl.textContent = (l==='en') ? 'EN' : 'PT';
      if(btn) btn.setAttribute('aria-label', (l==='en') ? 'idioma: english' : 'idioma: português');
      try{ if(l==='en'){localStorage.setItem(LKEY,'en');} else {localStorage.removeItem(LKEY);} }catch(e){}
    }
    apply(cur());
    if(btn){ btn.addEventListener('click', function(){ apply(cur()==='en'?'pt':'en'); }); }
  })();
  </script>
</body>
</html>
