">BGA empena ou trinca durante o chip-off.</b> <span class=\"cau\"><b>Causa:</b> um plano de terra grande drena o calor, então você superaquece um ponto só.</span> <b>Jogada:</b> pré-aqueça a placa, Kapton nos vizinhos, use a menor temperatura de ar que realmente refunde.", "t0559": "Quando dá errado", "t0560": "<b class=\"sy\">UART cospe lixo.<\/b> <span class=\"cau\"><b>Causa:<\/b> baud errado, nível lógico errado, sinal invertido, ou não é UART.<\/span> <b>Jogada:<\/b> varra os bauds padrão (<span class=\"mono\">115200 57600 38400 19200 9600 74880<\/span>); se um nível parecer estranho, meça TX em idle; se nada decodificar, confirme que é UART mesmo com um analisador lógico + sigrok.", "t0561": "<b class=\"sy\">A UART está totalmente muda.<\/b> <span class=\"cau\"><b>Causa:<\/b> você está no RX (ele fica flutuando), TX/RX estão trocados, ou o console está desabilitado nos bootargs.<\/span> <b>Jogada:<\/b> ache o pad que dispara ao ligar, esse é o TX; troque TX/RX; leia o <span class=\"mono\">console=<\/span> do boot log pra ver a porta certa. <span class=\"warn\">⚠ um console só-TX deixa você ler mas não digitar, não ache que está \"travado\".<\/span>", "t0562": "<b class=\"sy\">U-Boot não para no autoboot.<\/b> <span class=\"cau\"><b>Causa:<\/b> o <span class=\"mono\">bootdelay<\/span> é 0/-1/-2, ou você está batendo tecla tarde demais.<\/span> <b>Jogada:<\/b> martele uma tecla desde o instante em que liga. Se estiver mesmo trancado (<span class=\"mono\">bootdelay=-2<\/span>), vire pro glitch na <b>linha de dados da flash<\/b> pra forçar um fallback de recovery, não na linha UART TX.", "t0563": "<b class=\"sy\">Shell root, mas o rootfs é read-only e sem ferramentas.<\/b> <span class=\"cau\"><b>Causa:<\/b> o SquashFS é read-only, e <span class=\"mono\">init=/bin/sh<\/span> não subiu nenhum serviço.<\/span> <b>Jogada:<\/b> <span class=\"mono\">mount -o remount,rw /<\/span>, use os applets do BusyBox, e exfiltre pelo mesmo console (tar+base64) ou via <span class=\"mono\">tftp<\/span>/<span class=\"mono\">nc<\/span> se a rede estiver de pé. <span class=\"warn\">⚠ desative o watchdog primeiro, senão ele te reinicia no meio do trabalho.<\/span>", "t0564": "Quando dá errado", "t0565": "<b class=\"sy\">Pads JTAG/SWD sem rótulo.<\/b> <span class=\"cau\"><b>Causa:<\/b> sem silkscreen, pinout desconhecido.<\/span> <b>Jogada:<\/b> descubra o pinout na força bruta com JTAGenum (um Pico/Arduino) ou um JTAGulator, de olho num IDCODE válido. Junte todos os terras primeiro, e trate cada resultado como candidato. <span class=\"warn\">⚠ se só duas linhas respondem, assuma SWD, não JTAG.<\/span>", "t0566": "<b class=\"sy\">O IDCODE lê certinho, mas a memória volta zerada ou dá fault.<\/b> <span class=\"cau\"><b>Causa:<\/b> proteção de leitura (STM32 RDP, Nordic APPROTECT, eFuses).<\/span> <b>Jogada:<\/b> software não resolve isso, parte pra fault injection pra furar a verificação, ou leia o chip de flash fora da placa. Num roteador MIPS você vai topar com EJTAG, onde o modo PrAcc serve a memória pra você.", "t0567": "Porta de debug responde e a memória lê de volta?  →  <span class=\"go\">software<\/span>: dumpa, reverte, acha o bug.<br/>IDCODE lê mas a memória dá fault / retorna zero  →  proteção de leitura (RDP/APPROTECT), software não resolve.<br/>Sem debug utilizável e a flash é on-package/criptografada  →  <span class=\"stop\">fault injection<\/span>: glitch na verificação (seção 09).", "t0568": "Quando dá errado", "t0569": "<b class=\"sy\">A leitura SPI vem toda 0xFF/0x00, ou muda entre os dumps.<\/b> <span class=\"cau\"><b>Causa:<\/b> o SoC ainda controla o barramento / o CS não está em nível baixo / o chip sem alimentação / o clip ao contrário.<\/span> <b>Jogada:<\/b> liga o <b>/RST<\/b> do SoC no GND pra colocar os pinos em tri-state <span class=\"saver\">⏱ evita um dessolda<\/span>; se não rolar, levanta o <b>VCC (pino 8)<\/b> da flash e alimenta ela só pelo programador; baixa o clock pra <span class=\"mono\">512kHz-4MHz<\/span> em fios longos; reassenta o clip com flux. <span class=\"warn\">⚠ um clip virado 180° troca VCC/GND e MATA o chip, oriente pelo ponto do pino-1 ANTES de ligar.<\/span>", "t0570": "<b class=\"sy\">flashrom diz \"no flash device found\".<\/b> <span class=\"cau\"><b>Causa:<\/b> orientação de VCC/GND, um CH341A jogando ~5V nas linhas de dados, ou um chip ID desconhecido.<\/span> <b>Jogada:<\/b> reconfira a orientação do pino 1 e a tensão; se o JEDEC ID for ambíguo, force a peça exata com <span class=\"mono\">-c \"&lt;chip&gt;\"<\/span>. Confirme a tensão de I/O real do seu programador com um multímetro.", "t0571": "<b class=\"sy\">Detecta o chip, mas o erase/write falha calado ou verifica o valor antigo.<\/b> <span class=\"cau\"><b>Causa:<\/b> write-protect do status-register (bits BP/SRP), ou o pino <span class=\"mono\">/WP<\/span> do hardware segurado em low.<\/span> <b>Jogada:<\/b> <span class=\"mono\">flashrom --wp-status<\/span> pra inspecionar, <span class=\"mono\">--wp-disable<\/span> pra limpar; se SRP0 está setado com <span class=\"mono\">/WP<\/span> ativo, o registrador está congelado, então amarre <span class=\"mono\">/WP<\/span> em high primeiro.", "t0572": "<b class=\"sy\">É um chip de 1.8V? (descubra antes de energizar).<\/b> <span class=\"cau\"><b>Causa:<\/b> um programador de 3.3V num chip de 1.8V destrói ele.<\/span> <b>Jogada:<\/b> decodifique o sufixo (Winbond <span class=\"mono\">JW/FW<\/span> = 1.8V vs <span class=\"mono\">JV/FV<\/span> = 3.3V; Macronix <span class=\"mono\">MX25U<\/span> = 1.8V vs <span class=\"mono\">MX25L<\/span> = 3.3V) e confira o datasheet. <span class=\"warn\">⚠ nenhum CH341A, modado ou não, entrega 1.8V; use uma ferramenta com nível selecionável.<\/span>", "t0573": "Clipe no chip, leia duas vezes  →  <span class=\"go\">dois dumps idênticos?<\/span>  →  <b>pronto, in-circuit venceu.<\/b><br/>Lixo / diferente  →  amarre o <b>/RST<\/b> do SoC no GND e tente de novo.<br/>Ainda lixo  →  levante o <b>VCC (pino 8)<\/b> da flash, alimente só pelo programador.<br/>Ainda ruim, ou é um chip de 1.8V que sua ferramenta não consegue drivar  →  <span class=\"stop\">chip-off<\/span>: sopre ar quente e ponha num socket.", "t0574": "Quando dá errado", "t0575": "<b class=\"sy\">eMMC não enumera no leitor SD.<\/b> <span class=\"cau\"><b>Causa:<\/b> VCCQ incompatível, o SoC disputando, ou uma linha CMD flutuando.<\/span> <b>Jogada:<\/b> meça o VCCQ e case com ele (muitos têm IO de 1.8V, o leitor é 3.3V); segure o <b>SoC<\/b> em reset, não o <span class=\"mono\">RST_n<\/span> do próprio eMMC; ponha um pull-up de ~10k em CMD/DAT0. <span class=\"saver\">⏱ in-circuit aqui te poupa um reball inteiro<\/span>", "t0576": "<b class=\"sy\">O eMMC enumera, mas só aparece uma partição.<\/b> <span class=\"cau\"><b>Causa:<\/b> essa é só a user area, o resto são partições de hardware separadas.<\/span> <b>Jogada:<\/b> boot0/boot1/RPMB/GPP são devices próprios; <span class=\"mono\">echo 0 &gt; .../force_ro<\/span>, e <span class=\"mono\">mmc extcsd read<\/span> no registrador de config. O bootloader e os dados de fuse costumam morar no <b>boot0<\/b>.", "t0577": "<b class=\"sy\">Dump de NAND cru é só ruído.<\/b> <span class=\"cau\"><b>Causa:<\/b> o dump ainda tem OOB, erros de bit não corrigidos, blocos ruins e talvez scrambling.<\/span> <b>Jogada:<\/b> tire o OOB, aplique o ECC <i>exato<\/i> que o controlador do SoC usou (Hamming vs BCH, quem decide é o controlador, não o chip), pule os blocos ruins e reverta o scrambler por página. Só então o binwalk enxerga alguma coisa.", "t0578": "Quando dá errado", "t0579": "<b class=\"sy\">O glitching não faz nada em milhares de tentativas.<\/b> <span class=\"cau\"><b>Causa:<\/b> nenhum trigger estável, o rail errado, capacitores de desacoplamento comendo o glitch, ou um sweep grosso demais.<\/span> <b>Jogada:<\/b> primeiro fecha um trigger repetível (borda de reset, um byte de GPIO/UART, um padrão de consumo SAD); mira no rail <b>core<\/b>, não no IO de 3.3V; dessolda os capacitores bulk perto do chip; varre um grid e caça a fronteira da região de reset, depois dá zoom.", "t0580": "Caso condutor: um roteador SOHO barato, Parte I", "t0581": "Pra deixar concreto, percorra um roteador SOHO MediaTek/Realtek típico de ponta a ponta. Você acha o SPI-NOR de 8 pinos do lado do SoC, prende o clip, e a primeira leitura é toda <span class=\"mono\">0xFF<\/span>: contenção, porque o SoC dá boot desse mesmo chip. Você amarra o <span class=\"mono\">/RST<\/span> dele em low, lê duas vezes, os hashes batem, e você tem a imagem sem dessoldar. A UART é um header de 4 pads; o pad que oscila ao ligar é o TX, então você casa 3.3V, cruza TX/RX, e cai no U-Boot a 115200. <span class=\"mono\">printenv<\/span> vaza os bootargs e o layout da flash. A Parte I te deu os bytes.", "t0582": "Quando dá errado", "t0583": "<b class=\"sy\">binwalk inunda de falsos positivos ou super-extrai em lixo.<\/b> <span class=\"cau\"><b>Causa:<\/b> ele casa o começo de uma assinatura mas não o fim real dela.<\/span> <b>Jogada:<\/b> mude pro <b>unblob<\/b>, que calcula o fim de cada chunk pela spec do formato, depois confira com entropia. <span class=\"saver\">⏱ transforma uma árvore ilegível num rootfs limpo<\/span>", "t0584": "<b class=\"sy\">A entropia fica chapada em ~1.0 na imagem inteira.<\/b> <span class=\"cau\"><b>Causa:<\/b> o firmware é um blob OTA criptografado ou comprimido.<\/span> <b>Jogada:<\/b> desempacotar por software não vai ajudar; pivota pra UART/JTAG/bootloader pra recuperar a chave ou pegar um update em plaintext. Uma <b>queda<\/b> localizada de entropia é um header ou loader em plaintext, então extrai a partir daquele offset.", "t0585": "Quando dá errado", "t0586": "<b class=\"sy\">A emulação do roteador não dá boot.<\/b> <span class=\"cau\"><b>Causa:<\/b> o Firmadyne falha na maioria das imagens (rede, NVRAM, fixups de kernel faltando).<\/span> <b>Jogada:<\/b> use o FirmAE, cujas heurísticas de arbitragem dão boot em ~79%; ou pule o full-system de vez e faça rehost só do serviço vulnerável com o Greenhouse, e depois fuzze ele.", "t0587": "<b class=\"sy\">O firmware do MCU trava pra sempre no QEMU.<\/b> <span class=\"cau\"><b>Causa:<\/b> um registrador de status de periférico lê 0, então o firmware fica em busy-wait.<\/span> <b>Jogada:<\/b> modele o MMIO: o Fuzzware constrói modelos de acesso automaticamente, o HALucinator casa com o HAL do fabricante e stuba ele. Aí um fuzzer consegue de fato avançar.", "t0588": "Bug mora num binário autocontido (um CGI/daemon)?  →  <span class=\"go\">qemu-user<\/span> nesse binário, mais rápido.<br/>Precisa de nvram, /proc, IPC, ou o servidor web + o backend dele?  →  <span class=\"go\">full-system<\/span> (FirmAE).<br/>Full-system não dá boot?  →  rehospede só o serviço com <b>Greenhouse<\/b> e fuzze aquilo.", "t0589": "Quando dá errado", "t0590": "<b class=\"sy\">Disassembly do radare2 é lixo.<\/b> <span class=\"cau\"><b>Causa:<\/b> arch errada, tamanho de word, endianness, ou endereço base.<\/span> <b>Jogada:<\/b> defina tudo explicitamente (<span class=\"mono\">-a mips -b 32 -e cfg.bigendian=true -m &lt;base&gt;<\/span>); MIPS big-endian é a pegadinha clássica de roteador. Confira que strings, prólogos de função e xrefs resolvem.", "t0591": "<b class=\"sy\">Não acha onde um parâmetro web é tratado.<\/b> <span class=\"cau\"><b>Causa:<\/b> o handler está enterrado num binário de borda stripado.<\/span> <b>Jogada:<\/b> use o truque de shared-keyword do SaTC: dê grep no nome do parâmetro em <span class=\"mono\">/www<\/span>, ache a mesma string hardcoded no binário de borda, e então siga o taint dessa referência até o sink.", "t0592": "Quando dá errado", "t0593": "<b class=\"sy\">Achou um <span class=\"mono\">system()<\/span>/<span class=\"mono\">popen()<\/span>, é bug de verdade?<\/b> <span class=\"cau\"><b>Causa:<\/b> o sink só é bug se a entrada do atacante chega nele sem sanitização.<\/span> <b>Jogada:<\/b> siga o <span class=\"mono\">axt<\/span> de volta até a origem, confirme que o argumento é controlado pelo atacante, que nada filtra <span class=\"mono\">;|&amp;`$()<\/span> no caminho, e que o handler é alcançável pré-auth. Wrappers de fabricante tipo <span class=\"mono\">doSystem<\/span>/<span class=\"mono\">CsteSystem<\/span> são sinal de alerta.", "t0594": "<b class=\"sy\">O httpd escreve um valor NVRAM, outro binário lê e chama <span class=\"mono\">system()<\/span>.<\/b> <span class=\"cau\"><b>Causa:<\/b> taint de binário único para na escrita e perde o fluxo.<\/span> <b>Jogada:<\/b> usa uma ferramenta multi-binário (KARONTE, EmTaint) que modela IPC de NVRAM/env/arquivo pra o taint atravessar do binário setter pro getter.", "t0595": "Quando dá errado", "t0596": "<b class=\"sy\">O fabricante realmente consertou?<\/b> <span class=\"cau\"><b>Causa:<\/b> um hash de build novo não diz nada; recompilado não é consertado.<\/span> <b>Jogada:<\/b> dê <span class=\"mono\">radiff2<\/span> nos dois builds pra ver quais funções mudaram, e dê hash no <b>material<\/b> vulnerável (a chave, o <span class=\"mono\">n<\/span>/<span class=\"mono\">d<\/span> do RSA), não no ELF. Material idêntico significa que só recompilaram. Teste contra a produção, não o beta.", "t0597": "<b class=\"sy\">Travado revertendo um protocolo proprietário do dispositivo.<\/b> <span class=\"cau\"><b>Causa:<\/b> o formato na fita é opaco e talvez criptografado.<\/span> <b>Jogada:<\/b> o app companion é o atalho: rode <span class=\"mono\">jadx<\/span> no APK atrás de endpoints e chaves hardcoded, e use Frida pra fazer hook em TLS/pinning e dumpar o BLE/HTTP/MQTT em texto claro que o dispositivo confia, depois faça replay.", "t0598": "Caso condutor: mesmo roteador, Parte II", "t0599": "O binwalk extrai demais e vira lixo, então você troca pro <b>unblob<\/b> e pega um SquashFS limpo. O r2 abre o httpd mas o disassembly vem lixo até você setar <b>big-endian MIPS<\/b>, aí as strings e os prólogos resolvem. O SBOM aponta um <span class=\"mono\">dropbear<\/span> e BusyBox antigos, um n-day de graça. Aí você dá grep num nome de parâmetro do <span class=\"mono\">/www<\/span>, acha a mesma string no httpd, e o <span class=\"mono\">axt<\/span> caminha até um <span class=\"mono\">doSystem()<\/span> sem sanitizer, alcançável pre-auth. Esse é o bug, cola no CVE."};</script>
<script>
(function(){
  "use strict";
  var root=document.documentElement;
  /* theme */
  var tz=document.getElementById("tz"), tzi=document.getElementById("tzi"), tzt=document.getElementById("tzt");
  function sysDark(){try{return matchMedia("(prefers-color-scheme:dark)").matches}catch(e){return false}}
  function applyT(t){ if(t==="dark"||t==="light"){root.setAttribute("data-theme",t);}else{root.removeAttribute("data-theme");}
    var d=t==="dark"||(t!=="light"&&sysDark()); tzi.textContent=d?"☾":"☀"; tzt.textContent=t==="dark"?"dark":t==="light"?"light":"auto"; }
  var st=null; try{st=localStorage.getItem("ft101-theme")}catch(e){} applyT(st||"auto");
  tz.addEventListener("click",function(){ var c=null; try{c=localStorage.getItem("ft101-theme")}catch(e){}
    var n=c==="dark"?"light":c==="light"?"auto":"dark"; try{ n==="auto"?localStorage.removeItem("ft101-theme"):localStorage.setItem("ft101-theme",n);}catch(e){} applyT(n); });
  /* language */
  var lz=document.getElementById("lz");
  var PT = (window.PT_STRINGS)||{};
  function applyL(lang){
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k=el.getAttribute("data-i18n");
      if(el.__en===undefined) el.__en=el.innerHTML;
      el.innerHTML=(lang==="pt"&&PT[k]!=null)?PT[k]:el.__en;
    });
    root.setAttribute("lang", lang==="pt"?"pt":"en");
    if(lz) lz.innerHTML = lang==="pt" ? "EN" : "PT";
  }
  var sl=null; try{sl=localStorage.getItem("ft101-lang")}catch(e){}
  applyL(sl || (((navigator.language||"").toLowerCase().indexOf("pt")===0)?"pt":"en"));
  if(lz) lz.addEventListener("click",function(){ var c=root.getAttribute("lang")==="pt"?"pt":"en"; var n=c==="pt"?"en":"pt";
    try{localStorage.setItem("ft101-lang",n);}catch(e){} applyL(n); });
  /* copy + reveal */
  document.querySelectorAll(".term").forEach(function(term){ var b=term.querySelector(".copy"); if(!b)return; var code=term.querySelector("code");
    b.addEventListener("click",function(){ var t=code.innerText; var done=function(ok){b.textContent=ok?"copied ✓":"select+⌘C"; setTimeout(function(){b.textContent="copy";},1400);};
      function sel(){ try{var r=document.createRange();r.selectNodeContents(code);var s=getSelection();s.removeAllRanges();s.addRange(r);done(!!(document.execCommand&&document.execCommand("copy")));}catch(e){done(false);} }
      try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done(true);},sel);}else{sel();} }catch(e){sel();} }); });
  try{ if(matchMedia("(prefers-reduced-motion:reduce)").matches){ document.querySelectorAll(".reveal").forEach(function(el){el.classList.add("in")}); }
    else{ var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -6% 0px",threshold:.04});
      document.querySelectorAll(".reveal").forEach(function(el){io.observe(el)}); } }catch(e){ document.querySelectorAll(".reveal").forEach(function(el){el.classList.add("in")}); }
})();
</script>
