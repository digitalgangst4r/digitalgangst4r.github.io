<script id="i18n-data">window.PT_STRINGS = {"t0600": "Não tenho certeza se um pad é UART", "t0601": "Glitching não faz nada em milhares de tentativas", "t0602": "Travado revertendo um protocolo proprietário", "t0603": "Dump de EEPROM trunca ou repete", "t0604": "Caso condutor: roteador SOHO, Parte I", "t0605": "Caso condutor: mesmo roteador, Parte II", "t0606": "O crowbar, de verdade<span class=\"lvl i\">circuito</span>", "t0607": "O crowbar é um MOSFET de potência canal-N: dreno no rail que você quer derrubar, fonte no GND. Sobe o gate e ele satura, curto-circuitando o rail pro terra por dezenas a centenas de ns, depois solta. Dois detalhes fazem o rig. Primeiro, o gate é capacitivo, então pra chavear em poucos ns você precisa de um <b>gate driver</b> jogando ampères nele; um GPIO puro é lento e o pulso vira uma rampa preguiçosa (o ChipWhisperer já traz o driver e o MOSFET nos <span class=\"mono\">glitch_hp</span>/<span class=\"mono\">glitch_lp</span>). Segundo, os capacitores de desacoplamento do rail são reservatórios de carga que seguram a tensão e engolem seu tombo de ns, então dessolde os maiores perto do chip pra o crowbar puxar o rail de fato, deixando só o bastante pra placa ainda bootar entre tentativas. E mire no rail que o <b>core</b> roda: num STM32F2/F4 é o <span class=\"mono\">VCAP</span> (o pino de desacoplamento do regulador interno de 1.2V), não o VDD de 3.3V.", "t0608": "Trigger e oráculo primeiro<span class=\"lvl i\">preparo</span>", "t0609": "Antes de varrer um único parâmetro, trave duas coisas repetíveis. O <b>trigger</b> ancora o instante zero; num alvo concreto o mais confiável é a <b>borda de reset</b>: dispare na subida do <span class=\"mono\">nRST</span> e conte <span class=\"mono\">ext_offset</span> ciclos até a instrução alvo (a checagem de RDP, o compare da assinatura). Um byte de UART/GPIO que o alvo emite, ou um trigger SAD casando um padrão de consumo, servem quando não há borda limpa. O <b>oráculo</b> é como você sabe que ganhou sem ficar olhando: flash que volta com bytes <span class=\"mono\">!= 0xFF</span>, o debug respondendo depois de bloqueado, um retorno que só existe do outro lado da checagem. Sem oráculo você não classifica os tiros, e sem classificação a varredura é ruído.", "t0610": "Não copie números, caracterize<span class=\"lvl i\">a busca</span>", "t0611": "O par <span class=\"mono\">(ext_offset, width)</span> que ganha depende deste die, deste layout, desta fonte e até da temperatura, então copiar o número de um writeup quase nunca reproduz. Varra grosso primeiro: um <span class=\"mono\">ext_offset</span> largo com passo grande pra emoldurar a janela, poucas larguras, e classifique cada tiro em normal / reset / mudo / crash / win. A <b>região de reset é o seu mapa</b>: o win quase sempre mora na fronteira entre \"normal\" e \"reset\", forte o bastante pra corromper uma instrução, fraco o bastante pra não derrubar o chip. Ache essa fronteira, encolha a faixa em volta, diminua o passo e aumente as tentativas por ponto (é probabilístico; 1 win em 500 só aparece se você insistir). Abaixo de 1% de rendimento é normal, então automatize e deixe rodando; mudou a placa ou a temperatura, recaracterize.", "t0612": "<b class=\"sy\">Só reset, nunca um win.</b> <span class=\"cau\"><b>Causa:</b> a janela (<span class=\"mono\">ext_offset</span>) não cobre a checagem, o passo é grosso demais pra cair no ponto, ou o oráculo é estrito demais.</span> <b>Jogada:</b> valide o oráculo com um caso que você SABE que passa; alargue o <span class=\"mono\">ext_offset</span> pra ter certeza de emoldurar a checagem; na fronteira da região de reset, diminua o passo e some tentativas por ponto, o win fica a um fio do reset e passo grande pula por cima.", "t0613": "EJTAG e PrAcc, de verdade<span class=\"lvl i\">MIPS</span>", "t0614": "Em roteadores MIPS a porta de debug não é o DAP do ARM, é o <b>EJTAG</b>, e a alavanca é o <b>PrAcc</b> (processor access). Pare o core e ele salta pro <span class=\"mono\">dmseg</span>, o segmento de debug em <span class=\"mono\">0xFF20_0000</span>, rodando a partir do vetor de exceção de debug em <span class=\"mono\">0xFF20_0200</span>, onde cada fetch, load e store vira uma transação que a sonda atende na mão. O handshake fica no registrador de controle do EJTAG: quando <span class=\"mono\">PrAcc</span>=1 a CPU está parada esperando; você lê o registrador <b>Address</b> pra ver o que ela quer, checa <span class=\"mono\">PRnW</span> pra ler ou escrever, põe o valor no registrador <b>Data</b> e limpa o <span class=\"mono\">PrAcc</span> pra ela seguir. É assim que você empurra na colher um mini-gravador de flash pra dentro de um WRT54G brickado sem bootloader; as utilitárias clássicas HairyDairyMaid/TJTAG são exatamente esse loop, e o OpenOCD dirige isso por um alvo <span class=\"mono\">mips_m4k</span>.", "t0615": "O rig de medição<span class=\"lvl b\">montagem</span>", "t0616": "Dois jeitos de ver a corrente. Um <b>shunt</b>: um resistor pequeno (~1-50 Ω) em série com o Vcc ou o terra do chip, e você mede a tensão sobre ele. R maior dá mais sinal mas mais queda IR, então pode fazer o chip cair; ponha na perna de <b>terra</b> pra manter a ponta perto do GND. Uma <b>sonda EM de campo próximo</b> é sem contato, uma espirinha sobre o die ou um capacitor de desacoplamento, sem cortar trilha, e dá pra mover até o ponto que mais vaza. De qualquer forma, <b>dispare na operação cripto</b> (um GPIO que o alvo levanta em volta do encrypt, ou um trigger por padrão) e amostre bem acima do clock do dispositivo, algo como 5-10×, pra cada ciclo de clock se espalhar por vários pontos.", "t0617": "TVLA primeiro: será que vaza?<span class=\"lvl i\">vai / não vai</span>", "t0618": "Antes de gastar horas em CPA, rode <b>TVLA</b> como um vai/não-vai. Capture dois conjuntos de traços, um com plaintext <b>fixo</b> e um com plaintext <b>aleatório</b> (mantenha a chave fixa), e rode o t-test de Welch ponto a ponto. Se o <span class=\"mono\">|t|</span> cruzar <b>4.5</b> em qualquer lugar da janela cripto, o dispositivo vaza e vale atacar; se ficar plano, ou está bem protegido ou seu rig/trigger está errado, conserte isso antes. O TVLA também diz <i>onde</i> no tempo está o vazamento, o que semeia seus pontos de interesse e o alinhamento. É a hora mais barata que você vai gastar.", "t0619": "Bootou, mas o web server não sobe<span class=\"lvl i\">meio-boot</span>", "t0620": "O meio-ganho clássico: o FirmAE sobe o kernel e o userland mas a UI web nunca responde. Depure em <span class=\"mono\">./scratch/&lt;iid&gt;/</span>, onde o FirmAE joga o serial log e o palpite de rede: leia o serial log pra ver até onde o init foi, e pingue o IP que ele imprime. Se responde mas a porta 80 está morta, o httpd subiu antes da config existir, comum quando <span class=\"mono\">nvram_get</span> volta vazio ou falta um mount. Re-rode em modo debug (<span class=\"mono\">./run.sh -d</span>) pra pegar um console, e lá dentro cheque <span class=\"mono\">ps</span>, <span class=\"mono\">netstat -tlnp</span>, e suba o httpd na mão pra ver ele falhar. Metade das vezes é um único default de nvram faltando ou um caminho hardcoded pra uma partição que não montou.", "t0621": "<b class=\"sy\">Emula, mas o web server nunca responde.</b> <span class=\"cau\"><b>Causa:</b> um meio-boot: o httpd sobe antes da config, falta um default de nvram, ou uma partição não montou.</span> <b>Jogada:</b> leia o serial log em <span class=\"mono\">./scratch/&lt;iid&gt;/</span> e pingue o IP adivinhado; re-rode com <span class=\"mono\">./run.sh -d</span>, aí <span class=\"mono\">netstat -tlnp</span> por dentro e suba o httpd na mão pra ver ele falhar.", "t0622": "O atalho: leia pelo controlador<span class=\"lvl i\">saída de emergência</span>", "t0623": "Antes de reverter ECC e scrambler na mão, tente o caminho fácil: leia a NAND <b>pelo próprio controlador do SoC</b> com o dispositivo rodando. Com um shell, <span class=\"mono\">nanddump -f fw.bin -o /dev/mtd0</span> puxa uma imagem limpa, o driver já aplicou ECC e descrambling e o <span class=\"mono\">-o</span> omite o OOB. Isso pula o pipeline forense inteiro. Você só cai na reconstrução offline quando o chip está morto ou dessoldado: aí você tira o OOB na mão, e pra detectar um scrambler, olhe uma região que deveria estar apagada, se as páginas <span class=\"mono\">0xFF</span> voltam como ruído de alta entropia em vez de <span class=\"mono\">0xFF</span> plano, um randomizador por página está ligado e você precisa do PRNG do controlador pra desfazer.", "t0624": "Quando dá errado", "t0625": "<b class=\"sy\">O dump repete a cada 256 bytes.</b> <span class=\"cau\"><b>Causa:</b> em partes pequenas (24C04/08/16) os bits baixos do endereço são <b>page selects</b> internos, então o chip responde em vários endereços I2C.</span> <b>Jogada:</b> leia cada endereço de página e concatene, ex.: um 24C08 são quatro páginas de <span class=\"mono\">0x50</span> a <span class=\"mono\">0x53</span>; ou use o driver <span class=\"mono\">at24</span> do kernel informando o chip certo pra ele percorrer sozinho.", "t0626": "<b class=\"sy\">O dump trunca em 256 bytes.</b> <span class=\"cau\"><b>Causa:</b> de 24C32 pra cima o chip usa um <b>word address de 2 bytes</b>; uma ferramenta que manda um byte de endereço dá a volta.</span> <b>Jogada:</b> mande um endereço de 16 bits, ex.: <span class=\"mono\">i2ctransfer -y 1 w2@0x50 0x00 0x00 r256</span> lê 256 bytes do offset 0; ou use o driver <span class=\"mono\">at24</span> com o tamanho certo, ou um gravador dedicado.", "t0001": "mão na massa no hardware, depois fundo nos bytes", "t0002": "A <b>Parte I<\/b> é a bancada. É como você acha os pinos, solda neles e puxa uma imagem de firmware de um chip usando um multímetro, um clip, UART, JTAG, eMMC, ou, quando o silício simplesmente não coopera, um glitch ou um canal lateral. A <b>Parte II<\/b> é a parte divertida: você desempacota essa imagem, roda ela sem o hardware, abre tudo no radare2 e caça os bugs que aparecem em basicamente todo fabricante. Vai do seu primeiro bip de continuidade até injeção de falhas intermediária, e cada especificação e exemplo aqui foi conferido contra fontes reais.", "t0003": "domine o hardware, divulgue com responsabilidade", "t0004": "meça a tensão antes de conectar", "t0005": "leia e verifique antes de escrever qualquer coisa", "t0006": "toda afirmação com fonte, nada inventado", "t0007": "Conteúdo", "t0008": "Parte I — Hardware: tire os bytes de lá", "t0009": "Bancada, segurança &amp; boas práticas", "t0010": "Instrumentos: multímetro, LA &amp; osciloscópio", "t0011": "Solda, retrabalho e chip-off", "t0012": "UART: o caminho mais rápido pra entrar", "t0016": "Sniffing de I2C, SPI &amp; EEPROMs", "t0018": "Análise de canal lateral", "t0019": "A escada de equipamentos", "t0020": "Parte II — Firmware: analise os bytes", "t0021": "Adquira, desmonte &amp; a toolchain", "t0022": "Emulação &amp; rehosting", "t0023": "Analisar com radare2", "t0024": "Secure boot &amp; a cadeia de boot", "t0025": "Caça: classes de bug &amp; CVEs reais", "t0026": "Provar, reportar &amp; metodologia", "t0027": "Hardware: tirando os bytes do chip", "t0028": "Você não consegue analisar o que não consegue extrair. Esta metade é o trabalho braçal: uma bancada segura, os dois instrumentos que você pega toda sessão e todo jeito realista de chegar na flash, desde clipar um chip de 8 pinos até induzir falha numa CPU trancada pra ela te entregar os segredos.", "t0029": "Bancada, segurança &amp; boas práticas", "t0030": "Antes de extrair um único byte, monte uma bancada que não vá torrar seus chips, brickar seu alvo ou te machucar. Essa parte é chata até o momento exato em que salva uma placa (ou um dedo), então coloca na memória muscular cedo.", "t0031": "ESD é o choque que você nunca sente<span class=\"lvl b\">básico<\/span>", "t0032": "Andar pelo carpete te carrega com alguns quilovolts. Você não sente faísca abaixo de uns 3 kV, mas as partes mais sensíveis já começam a morrer abaixo de 250 V, então dá pra ferir um chip de flash e nem perceber, até ele começar a dar defeito estranho semanas depois. Um tapete aterrado baratinho mais uma pulseira antiestática deixam você e a placa no mesmo potencial, então nada nunca descarrega através do die. E o resistor daquela pulseira é pra ESD, não pra proteção contra choque, então tire a pulseira antes de chegar perto de qualquer coisa ligada na rede elétrica.", "t0033": "Uma fonte com limite de corrente é o seu cinto de segurança<span class=\"lvl b\">básico<\/span>", "t0034": "Uma fonte de bancada deixa você definir uma tensão e uma corrente máxima. Ajuste a tensão para o que o rail da placa pede (meça antes) e coloque o limite de corrente um pouco acima do consumo esperado. Agora uma ponte de solda ou um chip invertido só estoura o limite em vez de despejar amperagem infinita num curto morto. Se a fonte bater no limite e a tensão despencar, é curto: desliga e vai caçar.", "t0035": "Faça backup antes de gravar, sempre<span class=\"lvl i\">hábito<\/span>", "t0036": "A forma número um de brickar um dispositivo é escrever antes de ler. Faça o dump do chip inteiro, leia duas vezes, e confirme que os dois hashes batem pra ter certeza de que a leitura em si veio limpa. Essa imagem verificada é o seu botão de desfazer. Se você não conseguir duas leituras idênticas, ajuste o clip antes de encostar no caminho de escrita, porque um \"backup\" corrompido é pior do que nenhum.", "t0037": "Rede elétrica e lítio podem machucar <i>você<\/i><span class=\"lvl i\">safety<\/span>", "t0038": "Muitos gadgets baratos usam uma fonte não isolada onde o \"terra\" de baixa tensão está ligado direto na rede AC, então prender uma ponta de prova aterrada nele pode gerar uma falha letal. A jogada profissional é simplesmente não sondar o lado da rede elétrica: puxe o firmware da lógica de baixa tensão com a seção AC desligada. Se você realmente precisar sondar com ela energizada, use um transformador de isolamento 1:1 (ele remove o caminho de terra, não abaixa a tensão, a rede continua letal). Células de lítio liberam gás e pegam fogo se você perfurar, causar curto ou sobrecarregar, então desconecte a bateria e trabalhe pela sua fonte.", "t0039": "números que vale a pena saber", "t0040": "Dano por ESD nas peças mais sensíveis: <b>&lt;250 V<\/b>, muito abaixo do que você consegue sentir", "t0041": "Rails comuns: <b>1.8 / 3.3 / 5 V<\/b> (também 1.2, 2.5). Meça, não presuma", "t0042": "Célula de Li-ion: <b>3,7 V<\/b> nominal, <b>4,2 V<\/b> de carga máx, piso de ~2,5-3,0 V", "t0043": "Backup bom = <b>2 leituras, com SHA-256 idêntico<\/b>, antes de qualquer escrita", "t0044": "não", "t0045": "Aterre seu pulso nu direto no terra, ou fique com a pulseira antiestática perto da rede elétrica energizada.", "t0046": "Confiar numa única leitura da flash, ou rodar a fonte sem limite de corrente.", "t0047": "Dessolde antes de fotografar a placa e etiquete cada fio. Essa foto é o que salva você às 1h da manhã.", "t0048": "Instrumentos: multímetro, analisador lógico &amp; osciloscópio", "t0049": "Você mapeia uma placa com as mãos antes de qualquer ferro ou ponta de prova encostar nela. O multímetro acha o ground e os rails, o analisador lógico decodifica o que está de fato no fio, e o osciloscópio te mostra a verdade analógica quando algo está estranho.", "t0050": "O multímetro, quatro modos e pronto<span class=\"lvl b\">básico<\/span>", "t0051": "Ligado em quatro modos: continuidade (o beep) pra achar o ground e rastrear trilhas, tensão DC pra ler um rail contra o ground, e resistência e modo diodo pra componentes (só com a placa desligada, já que eles injetam a própria corrente e um rail energizado dá leitura lixo e pode machucar a entrada do multímetro). Ache o ground primeiro: continuidade, ponta preta num ground metálico óbvio, e ela apita contra qualquer outro ground. Aí prende a preta ali e deixa a ponta vermelha fazer toda a caminhada.", "t0052": "Ache os rails, depois os sinais candidatos<span class=\"lvl b\">básico<\/span>", "t0053": "Ligue a placa (USB ou DC jack, nunca o lado da rede elétrica), multímetro em DC volts, e passe a ponta vermelha pelo header. Um rail é um número firme feito rocha (5V, 3.3V, ou um core de 1.8V). Um pino <b>TX<\/b> de UART fica parado na tensão lógica e depois oscila por um segundo ou dois no power on enquanto o banner imprime, esse tremor no boot é a pista confiável. Um truque que evita dor de cabeça: leia primeiro a tensão do TX em repouso, porque esse número <i>é<\/i> o seu nível lógico e é ele que decide se você precisa de um level shifter.", "t0054": "O analisador lógico transforma palpite em decodificação<span class=\"lvl i\">level up<\/span>", "t0055": "Um clone FX2 de oito canais que custa $10 rodando <span class=\"mono\">sigrok/PulseView<\/span> é o melhor upgrade depois do multímetro. Prenda num header misterioso no boot e os decoders de protocolo leem UART, SPI e I2C direto do fio, então \"isso é UART ou SPI?\" deixa de ser chute. Ele também acerta um baud desconhecido: capture o TX, meça o pulso mais estreito (esse é um bit), e baud = 1/isso. Amostre pelo menos quatro vezes mais rápido que o sinal que você está atrás.", "t0056": "Resistência no circuito mente pra você<span class=\"lvl i\">pegadinha<\/span>", "t0057": "Ao medir resistência numa placa soldada, sua peça fica em paralelo com todos os outros caminhos entre aqueles nós, então um pull up de 10k pode ler 300 ohms. Trate resistência in-circuit como \"preso firme num rail ou não\", nunca como um valor real. Pra um valor de verdade você levantaria uma perna, mas raramente precisa.", "t0058": "specs rápidas", "t0059": "Ponta preta no <b>COM<\/b>, vermelha no <b>VΩ<\/b>. Vermelha esquecida no jack de 10A enquanto você mede tensão é um curto direto.", "t0060": "Largura de bit pra baud: <b>8.68 µs<\/b> ≈ 115200, 17.36 ≈ 57600, 104 ≈ 9600", "t0061": "Taxa de amostragem: <b>≥ 4×<\/b> a borda mais rápida que você quer ver", "t0062": "corrigido", "t0063": "<b>Nunca</b> meça resistência/continuidade/diodo numa placa energizada, esses modos injetam a própria corrente. Meça tensão com ela ligada, todo o resto desligada.", "t0064": "<b>RX quase sempre só flutua<\/b>, então não conte com ele ficando perto do Vcc. Ache o TX (o pino que dispara no boot) primeiro.", "t0065": "Confirme que o seletor está em <b>DC volts<\/b>, não em AC nem numa faixa de corrente, antes de encostar num rail energizado.", "t0066": "Solda, retrabalho &amp; chip-off", "t0067": "Ninguém conta o segredo real pros iniciantes: soldar é quase tudo fluxo e controle de calor, não pulso firme. Acerte esses dois e num fim de semana você vai estar grudando fios em test points de 0.5mm e levantando chips.", "t0068": "Fluxo é tudo<span class=\"lvl b\">básico<\/span>", "t0069": "Solda só flui em metal limpo e quente, e o flux tira o óxido pra ela molhar. Se uma junta te dá trabalho, <b>coloca flux, não aumenta a temperatura<\/b>. Uma caneta de flux no clean mais uma seringa de gel tacky é o equipamento mais subestimado da bancada. Aqueça a junta (ponta chanfrada, pad e terminal juntos) e alimente solda na junta pro próprio calor dela derreter, não na ponta.", "t0070": "Leia a solda, mas conheça sua liga<span class=\"lvl i\">critério<\/span>", "t0071": "Uma boa junta é um filete côncavo e liso que sobe pelo terminal. Com solda com chumbo (Sn63/Pb37) ela também fica brilhante, mas uma junta lead free (SAC305) perfeita parece fosca e granulada, então julgue pela <i>forma<\/i> do filete e pelo molhamento, não pelo brilho. Uma bola opaca pousada por cima é junta fria (reaqueça); solda ligando dois pads é uma ponte (remova com pavio).", "t0072": "Chip-off com ar quente<span class=\"lvl i\">subindo de nível<\/span>", "t0073": "Quando um chip não lê no lugar, tire ele de lá. Inunde com flux, passe o bico até que <i>toda<\/i> perna esteja derretida, e a peça se solta. Fixe os vizinhos com Kapton, e pré-aqueça placas com plano de terra grande pra você não empenar a PCB nem trincar as bolinhas de BGA. Esse é o seu plano B pra um chip SPI barulhento e o evento principal pra eMMC.", "t0074": "In-circuit primeiro, chip-off quando ele resistir<span class=\"lvl i\">estratégia<\/span>", "t0075": "Sempre tente ler o chip in-place primeiro, segurando o SoC em reset pra ele não brigar com você pelo barramento (mais sobre isso nas seções de SPI e eMMC). Duas leituras idênticas seguidas significam que acabou. Só parta pro hot air quando a placa simplesmente não te der um dump limpo e repetível.", "t0076": "Leia o chip no lugar com o SoC preso em reset pra ele não brigar com seu programador. Só dessolde quando linhas compartilhadas ou a alimentação ainda estragarem a leitura.", "t0077": "temperaturas", "t0078": "Sn63/Pb37 com chumbo derrete a <b>183 °C<\/b>, ferro a ~315-345 °C", "t0079": "SAC305 sem chumbo derrete a <b>~217 °C<\/b>, ferro a ~350-380 °C", "t0080": "Remoção com ar quente: com chumbo ~300-350, sem chumbo ~350-400 °C (use a menor temperatura que ainda derreta o solda)", "t0081": "cuidado", "t0082": "<b>Tire a bateria de lítio antes do ar quente<\/b>, e ventile: os fumos do flux e a solda com chumbo são tóxicos, lave as mãos.", "t0083": "Não deixe o ferro frio \"por segurança\". Contato demorado faz mais estrago do que uma ponta quente encostada rapidinho.", "t0084": "Temperatura demais num BGA racha o die ou levanta os pads, e não tem como desfazer.", "t0085": "UART: o caminho mais rápido pra dentro", "t0086": "Um console serial é a base de apoio de maior retorno em hardware hacking. Quatro pads que muito equipamento de consumo deixa totalmente abertos, muitas vezes te jogando direto no log de boot, no bootloader ou num shell root sem autenticação. O trabalho avançado não é achar a porta, é ler o nível e o baud dela direto do fio e saber o que fazer depois que entrou.", "t0087": "Ache os pads, depois faça o sniff com segurança<span class=\"lvl b\">básico<\/span>", "t0088": "Procure uma fileira de 3-4 pads ou um header não populado perto do SoC. O multímetro acha o GND (0Ω pro terra) e os rails; o TX é o que fica ocioso em nível alto e treme no boot. Pra só escutar, ligue apenas o RX do seu adaptador no TX do alvo mais um terra comum e deixe seu TX desconectado, risco zero de injetar qualquer coisa. Pra interagir, cruze eles: adaptador <b>TX pro RX do dispositivo<\/b>, RX pro TX, compartilhe o terra e <b>nunca ligue o VCC<\/b>. O framing é quase sempre <b>8N1<\/b>.", "t0089": "Acerte o nível ou frite um pino<span class=\"lvl i\">segurança<\/span>", "t0090": "3.3V é o mais comum, mas um monte de SoC moderno roda o console em <b>1.8V<\/b>, e 5V é raro. Não dá pra saber olhando, então meça. Um adaptador de 3.3V numa entrada de 1.8V pode destruir tudo, então coloca um level shifter (uma placa BSS138 dá conta até ~1MHz, ou usa um Tigard que ajusta a própria tensão de IO). E nunca ligue uma porta RS-232 de verdade (±12V) numa UART TTL, isso mata o chip na hora.", "t0091": "Interrompa o U-Boot e domine o ambiente<span class=\"lvl i\">a parte boa<\/span>", "t0092": "Durante o boot o U-Boot imprime \"Hit any key to stop autoboot\" e faz uma contagem regressiva. Martele uma tecla e você cai no prompt <span class=\"mono\">=&gt;<\/span>. Agora <span class=\"mono\">printenv<\/span> despeja todas as variáveis (bootargs, bootcmd, IPs de servidor e, com frequência, chaves de WiFi vazadas), <span class=\"mono\">setenv<\/span> edita na RAM, e você pula o <span class=\"mono\">saveenv<\/span> pra manter as mudanças voláteis e reversíveis. Tem também primitivas de memória crua (<span class=\"mono\">md<\/span>, <span class=\"mono\">mw<\/span>, <span class=\"mono\">cp<\/span>) que conseguem ler segredos da RAM ou até dumpar o firmware.", "t0093": "Force um shell com init=/bin/sh<span class=\"lvl i\">a parte boa<\/span>", "t0094": "Escalada clássica: acrescente <span class=\"mono\">init=/bin/sh<\/span> na linha de comando do kernel pra ele executar um shell antes de qualquer auth rodar, te jogando em uid 0. Reaproveite os bootargs que já existem e só adicione o token, depois <span class=\"mono\">boot<\/span>. Espere um rootfs só de leitura (<span class=\"mono\">mount -o remount,rw /<\/span>), sem rede nem serviços, e um watchdog que pode te reiniciar, então desabilite ele. Se o prompt estiver travado com <span class=\"mono\">bootdelay=-2<\/span>, é aqui que você parte pra um glitch na linha da flash (veja a seção de glitching).", "t0095": "GND lê 0Ω pro terra, TX pisca quando liga. Case o nível, cruze TX e RX, compartilhe o terra, e deixe o TX do adaptador desligado se você só quer escutar.", "t0096": "Calix GigaCenter ONT: root sem autenticação via UART", "t0097": "Vários modelos de ONT baseados em Broadcom expõem um console 115200 desprotegido que cai direto num shell root, sem auth nenhuma.", "t0098": "Fazendo glitch no U-Boot dando curto na NAND", "t0099": "Brad Dixon forçou um shell de recovery num bootloader travado aterrando rapidamente uma linha de dados da NAND num momento disparado por log, furando o <span class=\"mono\">bootdelay=-2<\/span>. Nota: a alavanca é a linha do flash, não a TX. Aterrar a TX às cegas pode ser destrutivo (na Airoha EN7523 ela é um pino de bootstrap e corrompe a SPI-NAND).", "t0101": "JTAG e seu primo ARM de dois fios, o SWD, são a espinha dorsal de debug de quase toda placa. Se o fabricante deixou eles ativos, você consegue parar a CPU, ler a memória e fazer dump da flash sem dessoldar nada. Isso vai além de \"achar quatro pinos e rodar OpenOCD\", entrando em truques de boundary scan e no que fazer quando a porta está queimada por fuse.", "t0102": "Os sinais, e o SWD reaproveitando eles<span class=\"lvl b\">basics<\/span>", "t0103": "JTAG tem quatro fios obrigatórios: <b>TCK<\/b> (clock), <b>TMS<\/b> (estado), <b>TDI<\/b> (entrada), <b>TDO<\/b> (saída), mais resets opcionais. O SWD reduz isso pra <b>SWDIO<\/b> + <b>SWCLK<\/b> em ARM Cortex, e literalmente reaproveita os pinos do header JTAG (SWDIO no TMS, SWCLK no TCK). Se só duas linhas de debug respondem, assuma SWD. Mas atenção, um monte de SoC de aplicação roteia só JTAG, então não conte com o SWD estar lá.", "t0104": "Ache uma porta sem rótulo<span class=\"lvl i\">recon<\/span>", "t0105": "Numa placa sem marcações, os pads de debug não têm nome. <b>JTAGenum<\/b> (firmware pra um Arduino/Pico) permuta um monte de GPIOs procurando um IDCODE válido; o <b>JTAGulator<\/b> do Joe Grand é hardware feito pra isso, com 24 canais protegidos e tensão de alvo ajustável (1.2 a 3.3V) que roda scans de IDCODE e BYPASS. Os dois chutam pinos desconhecidos em todas as permutações, então trate os resultados como candidatos e junte os terras primeiro.", "t0106": "Boundary scan: ler uma flash pelos pinos da CPU<span class=\"lvl i\">fundo<\/span>", "t0107": "Todo pino compatível tem uma célula de scan entre o pad e o núcleo. <b>SAMPLE<\/b> tira um instantâneo dos estados dos pinos (seguro); <b>EXTEST<\/b> desconecta o núcleo e controla os pinos direto a partir desse registrador. Com o arquivo BSDL do chip você sabe qual bit do registrador mapeia pra qual ball, então dá pra fazer bit-bang nos próprios GPIOs da CPU que ligam num SPI/NAND flash externo e clocar o flash pra fora sem nenhum firmware rodando. É dolorosamente lento mas funciona quando você não consegue dessoldar, e boundary scan muitas vezes sobrevive a fusíveis de \"debug disable\" porque é uma feature de teste separada.", "t0108": "gdb via DAP, e quando está com fuse queimado<span class=\"lvl i\">avançado<\/span>", "t0109": "O OpenOCD fala CoreSight e te dá um servidor gdb na 3333, telnet na 4444. Pare o core, <span class=\"mono\">dump_image fw.bin 0x08000000 0x100000<\/span>, pronto. Mas se o IDCODE lê certinho enquanto a memória volta toda zerada ou dá fault, a peça está com proteção de leitura: STM32 RDP, Nordic APPROTECT, eFuses. Os bypasses são quase sempre fault injection, não software (veja glitching). Em roteadores MIPS você vai encontrar EJTAG no lugar, onde o modo PrAcc faz a CPU servir os acessos de memória pra você, que é como roteadores brickados estilo WRT54G são desbrickados.", "t0110": "JTAG coloca uma célula de registrador de deslocamento entre cada pino e o núcleo. Desloque o anel e você consegue ler (SAMPLE) ou controlar (EXTEST) cada pino, até fazer bit-bang numa flash externa através das próprias pernas da CPU.", "t0111": "Leitura de RDP1 no STM32 via glitch", "t0112": "Obermaier &amp; Tellenbach mostraram que dá pra derrotar a leitura da flash com RDP1; ferramentas seguintes dumpam STM32F1 protegido por RDP1 com um Pi Pico de $4. Um writeup de STM32F4 puxou 256KB depois de 1.024 acertos em 621.594 tentativas.", "t0113": "Des-brick do WRT54G via EJTAG", "t0114": "A Debrick Utility do HairyDairyMaid e o TJTAG usam EJTAG puro pra apagar e reflashar roteadores MIPS brickados sem bootloader funcionando, a prova clássica de que o JTAG é dono da placa.", "t0116": "SPI-NOR é onde a maioria dos dispositivos pequenos guarda o firmware, e é o chip mais fácil de dumpar que existe. Ache aquele flashzinho de 8 pinos perto do SoC, prenda o clip e leia a imagem inteira em segundos. O que é mais avançado é ganhar a briga pelo controle do barramento e não fritar uma peça de 1.8V.", "t0117": "Um pinout pra dominar todos<span class=\"lvl b\">básico<\/span>", "t0118": "Todo chip 25-series de 8 pinos (Winbond W25Q, Macronix MX25, GigaDevice GD25) compartilha o layout JEDEC do diagrama. Oriente pelo ponto do pino 1: um clip virado 180° troca power e ground e mata o chip. Numa ligação SPI single simples, puxe <span class=\"mono\">/WP<\/span> (pino 3) e <span class=\"mono\">/HOLD<\/span> (pino 7) pra alto ou o chip fica travado. E os dígitos são mega<b>bits<\/b>: W25Q128 tem 16 MB, não 128.", "t0119": "Ganhe o barramento: segure o SoC fora dele<span class=\"lvl i\">o truque<\/span>", "t0120": "Leituras in-circuit voltam como lixo (tudo 0xFF, ou diferente a cada vez) porque o SoC controla as mesmas linhas. Duas soluções: puxe o <span class=\"mono\">/RST<\/span> do SoC pro terra pra deixar os pinos SPI dele em tri-state, ou levante o VCC da flash (pino 8) e alimente o chip só pelo seu programador. Comece com o clock SPI baixo (512 kHz a 8 MHz por um clip), 33 MHz costuma ser rápido demais em fios longos.", "t0121": "A armadilha do 1.8V e o perigo do CH341A<span class=\"lvl i\">safety<\/span>", "t0122": "Decodifique o sufixo antes de ligar qualquer fio: Winbond <span class=\"mono\">JV/FV<\/span> = 3.3V, <span class=\"mono\">JW/FW<\/span> = 1.8V (mais ou menos 1.7 a 1.95V); Macronix <span class=\"mono\">MX25L<\/span> = 3.3V, <span class=\"mono\">MX25U<\/span> = 1.8V. Bater 3.3V num componente de 1.8V destrói ele. Separadamente, o CH341A preto comum controla suas linhas de dados em ~5V mesmo em \"3.3V\", então use uma placa devidamente modificada ou um Tigard, e para um componente de 1.8V o CH341A está fora de cogitação (nenhum mod deixa ele em 1.8V), você precisa de uma ferramenta com nível selecionável.", "t0123": "Proteção de escrita, caso você algum dia grave de volta<span class=\"lvl i\">avançado<\/span>", "t0124": "Leituras ignoram a proteção de escrita, mas qualquer erase ou program falha silenciosamente até você limpar ela. Ela mora nos status registers (os bits BP/TB/SEC/CMP mais SRP0/SRP1). <span class=\"mono\">flashrom --wp-status<\/span> mostra, <span class=\"mono\">--wp-disable<\/span> limpa. A pegadinha: se o pino de hardware <span class=\"mono\">/WP<\/span> estiver segurado em nível baixo com SRP0 setado, o registrador congela e o software não consegue destravar, então prenda o <span class=\"mono\">/WP<\/span> em nível alto primeiro. Alguns chips até vêm de fábrica com os bits BP setados.", "t0125": "O layout SOIC de 8 pinos que está em quase todo roteador. Um clip SOIC-8 encaixa cada contato no sinal certo assim que você orienta pelo ponto do pino 1.", "t0126": "Huawei HG533: alimente só a flash", "t0127": "O writeup muito citado do jcjc-dev briga com um SoC Ralink pelo barramento SPI, alimenta a flash Spansion direto pra manter o SoC quieto, e faz o dump via flashrom num Pi. O tutorial canônico de in-circuit.", "t0128": "Desmontagem de roteador, chip-off como plano B", "t0129": "O clássico do wrongbaud: a leitura in-circuit falhou porque o CS não estava puxado pra baixo o suficiente, então o chip saiu com ar quente e foi dumpado num Bus Pirate. O binwalk aí mostrou U-Boot em dobro, um kernel e SquashFS.", "t0130": "eMMC &amp; NAND raw", "t0131": "Quando um aparelho é grande demais pra um chip SPI de 8 pinos (celulares, tablets, roteadores, câmeras), o firmware vive em eMMC ou NAND raw. O eMMC é o camarada porque um controlador esconde a física bagunçada. NAND raw te entrega o array pelado e te obriga a fazer a conta forense na mão.", "t0132": "eMMC é basicamente um cartão SD com emprego<span class=\"lvl b\">básico<\/span>", "t0133": "É NAND cru mais um controlador num único BGA, falando o protocolo JEDEC MMC, eletricamente da mesma família de um cartão SD. O controlador faz wear leveling, ECC e bad blocks, então você lê setores lógicos limpos. E ele sempre dá boot em <b>1-bit mode<\/b>, então você só precisa de seis linhas pra ter um dump completo: CLK, CMD, DAT0, VCC, VCCQ e ground.", "t0134": "O truque do eMMC pra leitor de SD<span class=\"lvl i\">o truque<\/span>", "t0135": "Como é MMC, solde esses pontos num leitor USB de microSD baratinho e o host enumera ele como <span class=\"mono\">/dev/sdX<\/span>, aí é só <span class=\"mono\">dd<\/span>. Duas coisas pegam a galera: o VCCQ tem que estar feliz nos 3.3V do leitor (muitos chips modernos usam IO de 1.8V, então meça, VCCQ errado pode danificar o die), e você tem que segurar o <b>SoC<\/b> em reset (não o RST_n do próprio eMMC) pra CPU não estar dando boot pelo mesmo chip e brigando com você.", "t0136": "Não perca as partições escondidas<span class=\"lvl i\">loot<\/span>", "t0137": "O disco que você enumera é só a user area. O eMMC também tem <b>boot0/boot1<\/b> (onde costumam morar o bootloader e os dados de fuse), <b>RPMB<\/b> (anti-rollback autenticado, você não lê sem a chave) e até quatro GPPs. No Linux eles aparecem como <span class=\"mono\">mmcblk0boot0<\/span> etc, exportados como somente leitura até você fazer <span class=\"mono\">echo 0 &gt; .../force_ro<\/span>. <span class=\"mono\">mmc extcsd read<\/span> despeja o registrador de config. Um \"dd na user area\" ingênuo perde as partes boas.", "t0138": "NAND cru: um dump não é um sistema de arquivos<span class=\"lvl i\">deep<\/span>", "t0139": "NAND cru (TSOP-48) te dá páginas mais bytes <b>OOB/spare<\/b> que guardam o ECC e os marcadores de bad-block. Três transformações ficam entre o dump e uma imagem montável: corrigir os erros de bit com o ECC exato que o controlador do SoC usou (Hamming ou BCH, e é o <i>controlador<\/i> que define o esquema, não o chip), pular os bad blocks de fábrica, e muitas vezes reverter um scrambler por página que faz o silício cru parecer puro ruído. Só aí o binwalk enxerga alguma coisa. Ferramentas como OFRAK e a recuperação de FTL do Joshua Wise mostram o pipeline completo.", "t0140": "Ligue as seis linhas num leitor de cartão e o SO monta o eMMC como um dispositivo de bloco. VCCQ define o nível do barramento (1.8 ou 3.3V), VCC alimenta o núcleo NAND.", "t0141": "NAND raw carrega bytes spare/OOB pra ECC e marcadores de bad-block em cada página. O binwalk não vê nada até o OOB ser removido e o ECC aplicado, que é exatamente por que o eMMC gerenciado é o alvo mais fácil.", "t0142": "Firmware do Amazon Echo via eMMC", "t0143": "A River Loop identifica os pontos de teste do eMMC com um analisador lógico, lê pelo barramento MMC e recorta a imagem de múltiplas partições (xloader, boot, main-A/B, recovery), um passo a passo de ISP limpo.", "t0144": "Recuperando o NAND cru de um cartão SD", "t0145": "Depois que o controlador morreu, Joshua Wise dessoldou o NAND, leu ~12GiB por um FPGA, e fez engenharia reversa do BCH ECC, do interleaving e do wear leveling pra reconstruir os dados por completo. O exemplo prático definitivo.", "t0146": "Sniffing de I2C, SPI &amp; EEPROMs seriais", "t0147": "O flash não é o único lugar onde moram segredos. Uma EEPROM I2C minúscula de 8 pinos do lado do SoC costuma guardar config, calibração, endereços MAC e às vezes credenciais ou chaves. Dois fios, ferramentas baratas, vitória rápida.", "t0148": "I2C em um parágrafo<span class=\"lvl b\">básico<\/span>", "t0149": "Dois fios, <b>SDA<\/b> (dados) e <b>SCL<\/b> (clock), compartilhados por um master e vários dispositivos, cada um no seu endereço de 7 bits, com resistores de pull up (~4.7k) para o Vcc. Grampeie SDA/SCL com um logic analyzer e o decoder I2C do sigrok para farejar o tráfego de config de forma passiva, ou vire o master com um Bus Pirate ou um Raspberry Pi e leia um chip direto.", "t0150": "Dumpando uma EEPROM da série 24<span class=\"lvl i\">the win<\/span>", "t0151": "Essas moram em <span class=\"mono\">0x50<\/span> até <span class=\"mono\">0x57<\/span>. No Linux com um adaptador USB-I2C, o <span class=\"mono\">i2cdetect<\/span> acha ela e o <span class=\"mono\">i2cdump<\/span> lê. A pegadinha clássica: em peças pequenas (24C04/08/16) os pinos de \"endereço\" também funcionam como seletores internos de página, então um 24C08 responde em vários endereços e você tem que ler cada página. De 24C32 pra cima (32 kbit / 4KB e maior) o chip muda pra um endereço de palavra de 2 bytes. Erre isso e você pega um dump truncado ou repetido.", "t0152": "Farejе o SPI em vez de prender o clip<span class=\"lvl i\">alt<\/span>", "t0153": "Às vezes você não quer brigar com o SoC por um chip de flash, você só quer ver ele bootar. Coloca o analisador lógico no CLK/MOSI/MISO/CS e o decoder SPI do sigrok reconstrói exatamente o que o SoC lê no power on, incluindo o fetch inicial do bootloader. É passivo, não destrutivo, e ótimo pra entender um fluxo de boot antes de você se comprometer com um dump.", "t0154": "Dois fios, muitos dispositivos, cada um no seu endereço. Faça sniff de SDA/SCL pra ler o tráfego de config, ou vire o master e dê <span class=\"mono\">i2cdump<\/span> na EEPROM que tantas vezes guarda a parte boa.", "t0155": "Injeção de falhas (glitching)", "t0156": "Essa é a porta pros chips que simplesmente dizem não: flash com leitura protegida, firmware criptografado, secure boot. Em vez de achar um bug de software, você empurra o chip pra fora da faixa segura dele por alguns nanossegundos pra ele errar o cálculo de uma instrução no momento exato. Essa única instrução corrompida pode pular uma verificação de assinatura ou virar um \"nega\" em \"permite\". Já fizeram isso em carteiras de hardware, consoles de videogame, e numa antena Starlink, muitas vezes com menos de $100 de equipamento.", "t0157": "Quebre uma instrução, não o chip<span class=\"lvl b\">idea<\/span>", "t0158": "Uma CPU assume tensão estável e um clock limpo. Viole isso por um instante e um transistor trava errado, então uma instrução executa incorretamente: um compare retorna a resposta errada, um branch não é tomado. Você não precisa de controle cirúrgico sobre <i>o que<\/i> quebra, só que caia numa instrução crítica de segurança. É probabilístico, então o trabalho todo é timing repetível mais uma varredura de parâmetros mais um monte de tentativas.", "t0159": "Voltage glitching com um crowbar<span class=\"lvl i\">mais barato<\/span>", "t0160": "O rig clássico é um \"crowbar\": um power MOSFET atravessando o Vcc que o glitcher curto-circuita pro terra por dezenas a centenas de nanossegundos. O paper do crowbar do Colin O'Flynn é a referência canônica e é exatamente o que o ChipWhisperer traz embutido.", "t0161": "Clock, EM e laser<span class=\"lvl i\">a família<\/span>", "t0162": "<b>Clock glitch<\/b>: insere um ciclo curto demais pra violar setup/hold, preciso e barato mas só pra peças com clock externo. <b>EMFI<\/b>: um pulso de bobina sobre o die, sem contato, funciona através do encapsulamento e em peças com reguladores internos (o PicoEMP open source do O'Flynn é a ferramenta de entrada). <b>Laser<\/b>: um pulso focado através do silício afinado em ~1064nm dá precisão de bit único, ciclo único, o mais poderoso e o mais caro.", "t0163": "Dispara, varre, detecta<span class=\"lvl i\">o loop<\/span>", "t0164": "Um glitch é inútil se você não consegue colocá-lo no mesmo instante toda vez, então o gatilho é metade da batalha: uma borda de reset, um byte de GPIO ou UART, ou um padrão de energia (um gatilho SAD dispara quando o traço ao vivo bate com uma impressão digital armazenada). Depois varra offset, largura e força, classifique cada tentativa (normal / reset / mudo / crash / <b>vitória<\/b>), e plote. O glitch de ouro quase sempre fica na fronteira da região de reset, então você faz uma varredura grosseira, acha essa fronteira e dá zoom. Rendimentos abaixo de 1% são normais, então automatize e tenha paciência.", "t0165": "Derruba a tensão do core por alguns nanossegundos exatamente quando a CPU checa a assinatura, e ela pode pular aquela instrução.", "t0166": "Você não chuta parâmetros, você varre. Os acertos se concentram numa janelinha que você acha escaneando grosso e depois dando zoom.", "t0167": "ferramentas e alvos", "t0168": "STM32 <b>RDP<\/b>: L1 bloqueia a leitura da flash, L2 mata o debug pra sempre. L1 é o alvo comum de glitch.", "t0169": "Equipamento: ChipWhisperer (Nano ~$50 → Husky ~$500), crowbar MOSFET DIY (~$5), PicoEMP (EMFI, &lt;$50).", "t0170": "Qualquer proteção que passa por um único compare/branch é um alvo de glitch.", "t0171": "cuidado", "t0172": "<b>Equipamento de EMFI/laser opera de centenas de volts a kV.<\/b> Descarregue os capacitores por um resistor, cuidado com o risco pros olhos, nunca burle os interlocks.", "t0173": "Um glitch fundo demais faz brick no chip, então comece fraco. Recaracterize para cada placa e cada temperatura.", "t0174": "Um glitch não descriptografa firmware, ele te dá exec de código ou debug de onde você dumpa as chaves.", "t0176": "Carteiras STM32F205: um glitch de tensão no boot rebaixa o RDP2 pra RDP1, reativando o debug pra que a seed criptografada possa ser dumpada. A Kraken depois reproduziu isso como um ataque físico de uns 15 minutos.", "t0177": "Antena Starlink rootada no palco", "t0178": "Lennert Wouters aplicou voltage fault na verificação de assinatura do bootloader da ROM do SoC pra rodar código próprio na antena, com um modchip de ~US$ 25 (RP2040 + regulador).", "t0179": "Bypass genérico de secure boot", "t0180": "A demo fundamental da Riscure: dá glitch no branch de verificação de assinatura num fluxo de secure boot e código não assinado roda. O template que todo mundo reaproveita.", "t0182": "Vale acertar: Fusée Gelée (CVE-2018-6242) é um overflow de <i>software<\/i> no bootROM via USB, não um glitch. Switches corrigidos são atacados, em vez disso, com modchips de voltage-glitching.", "t0183": "Análise de side-channel", "t0184": "Glitching faz um chip se comportar mal. Side-channel analysis só <i>observa<\/i> ele se comportando e lê o segredo a partir do vazamento. A corrente que um chip consome depende dos dados que ele está processando, então com traces de potência suficientes e um pouco de estatística você consegue extrair uma chave AES de um dispositivo que não tem bug nenhum de software.", "t0185": "Por que os chips vazam<span class=\"lvl b\">ideia<\/span>", "t0186": "Na lógica CMOS, um gate queima um pouco mais de energia quando um bit muda do que quando ele fica parado, então a corrente instantânea carrega uma leve marca do dado sendo processado. Meça essa corrente ao longo do tempo e você tem um \"trace\" de potência. <b>SPA<\/b> lê segredos de um único trace no olho (um square-and-multiply de RSA parece diferente pra um 1 vs um 0). <b>DPA<\/b> e <b>CPA<\/b> usam estatística sobre muitos traces pra extrair uma chave mesmo quando o vazamento está enterrado no ruído.", "t0187": "Medindo isso: shunt ou sonda EM<span class=\"lvl b\">setup<\/span>", "t0188": "Coloque um pequeno resistor shunt na linha Vcc do chip e meça a tensão sobre ele (corrente = consumo dependente dos dados), ou segure uma sonda EM de campo próximo sobre o die pra captar isso sem contato. Depois dispare o gatilho na operação cripto e capture. Um ChipWhisperer já traz junto o shunt, um ADC sincronizado e o alvo, e é por isso que ele é a plataforma padrão pra aprender.", "t0189": "Recuperando AES-128 com CPA<span class=\"lvl i\">o ataque<\/span>", "t0190": "O truque é que o SubBytes da primeira rodada do AES depende só de um byte da chave e um byte conhecido do plaintext, então você ataca um byte por vez. Pra cada um dos 256 palpites você prevê o vazamento (normalmente o Hamming weight da saída da SBox) e correlaciona essa previsão com os traces que mediu. O palpite certo dá um pico de correlação e os outros 255 ficam achatados. Repete pros 16 bytes e você tem a chave. Um AES em software sem proteção costuma cair em algumas centenas a alguns milhares de traces.", "t0191": "Alinhamento, POIs e contramedidas<span class=\"lvl i\">profundo<\/span>", "t0192": "Traces reais estão desalinhados e cheios de ruído, então você faz o pré-processamento: alinha (até alinhamento elástico via dynamic time warping), filtra, e escolhe os pontos de interesse, e usa <b>TVLA<\/b> (um t-test fixo vs aleatório, |t| &gt; 4.5) pra checar se o dispositivo vaza alguma coisa antes de atacar. <b>Template attacks<\/b> perfilam um dispositivo clone primeiro e são a classe mais forte quando dá pra fazer. As defesas são masking (aleatorizar valores intermediários), hiding (shuffling, delays aleatórios), e código de tempo constante, que aumentam a quantidade de traces necessária em vez de tornar impossível.", "t0193": "A corrente que um chip puxa depende dos dados que ele processa. Meça ela através de um shunt, colete milhares de traces, e a correlação recupera a chave. Sem glitch, sem execução de código.", "t0194": "O DPA nasce (1999)", "t0195": "Kocher, Jaffe &amp; Jun quebraram o DES em smartcards com uma diferença de médias sobre traços de consumo e deram origem ao campo inteiro. O CPA (Brier, Clavier, Olivier, 2004) deixou tudo mais eficiente em número de traços com um modelo de correlação.", "t0196": "PIN do Trezor One via SCA", "t0197": "O laboratório Donjon da Ledger recuperou o PIN do Trezor One com um side channel de consumo, dentro do limite de 15 tentativas do aparelho, e divulgou de forma responsável.", "t0198": "Entrada sem chave KeeLoq, totalmente quebrada", "t0199": "DPA em chips de controle remoto KeeLoq de garagem/carro recuperou chaves de dispositivo a partir de ~10 traces e até extraiu chaves de fabricante, possibilitando clonagem.", "t0201": "O hands-on canônico: capture traces de um alvo tiny-AES e recupere a chave AES-128 inteira um byte por vez. A melhor forma de aprender CPA de verdade.", "t0202": "A escada de equipamento: o que comprar, e em que ordem", "t0203": "O jeito feio de fracassar nesse hobby é gastar US$ 600 num ChipWhisperer antes de ter um multímetro de US$ 15. Suba de nível só quando um projeto de verdade te travar, e seu primeiro setup já consegue ler um chip e abrir um console pelo preço de uma pizza.", "t0204": "Tier 1 (~$30-60): console + flash<span class=\"lvl b\">comece aqui<\/span>", "t0205": "Noventa por cento da extração de iniciante, barato: um <b>multímetro<\/b> com bip, um <b>adaptador USB-UART<\/b> (3.3V por padrão; os baratos só fazem 3.3/5V, um alvo 1.8V de verdade precisa de um adaptador com level shifting), um <b>CH341A + clip SOIC-8<\/b>, e um ferro básico com controle de temperatura. Não pule o multímetro, você mede a tensão de lógica antes de cada conexão.", "t0206": "Nível 2 (~US$120-250): ver sinais, retrabalhar SMD<span class=\"lvl i\">subir de nível<\/span>", "t0207": "Um <b>analisador lógico de 8 canais<\/b> baratinho (clone de FX2 no sigrok/PulseView) transforma \"UART ou SPI?\" num decode. Uma <b>estação de hot air<\/b> levanta chips que um clip não alcança. Adicione um <b>tapete + pulseira antiestática<\/b>, uma <b>fonte de bancada com limite de corrente<\/b> e <b>helping hands<\/b>. Essa é a diferença entre ler um dispositivo e modificar um.", "t0208": "Tier 3 (especialista, compre para o projeto)<span class=\"lvl i\">só quando precisar<\/span>", "t0209": "De propósito único e caro: um <b>JTAGulator<\/b> para pinouts desconhecidos, um <b>Tigard ou J-Link<\/b> para debug confiável, um <b>ChipWhisperer<\/b> para glitching e side channel, um <b>eMMC programmer<\/b> mais preheater e microscópio para storage BGA. Sem uma necessidade concreta, você não está pronto para gastar aqui.", "t0210": "O Flipper Zero, sinceramente<span class=\"lvl i\">real talk<\/span>", "t0211": "Realmente útil como ponte de GPIO e divertido de carregar, USB-UART decente, dá pra fazer bit-bang de SPI/I2C. Mas a amostragem dele não chega nem perto de um analisador lógico de verdade e não substitui um CH341A numa flash de vários MB. Compre como kit de bolso, não como laboratório.", "t0212": "stack de software (grátis, instale hoje)", "t0213": "<span class=\"mono\">sigrok/PulseView<\/span> (analisador lógico + decoders), <span class=\"mono\">OpenOCD<\/span> (JTAG/SWD), <span class=\"mono\">flashrom<\/span> (SPI), <span class=\"mono\">binwalk / unblob<\/span> (extrai firmware), <span class=\"mono\">radare2<\/span> ou Cutter (desmonta), <span class=\"mono\">picocom<\/span> (serial), <span class=\"mono\">QEMU / FirmAE<\/span> (emula). Do começo ao fim sem uma única licença.", "t0400": "Firmware: analisando os bytes", "t0401": "Você tem a imagem. Esta metade é o workflow de 2024/2025: extrair com ferramentas que não mentem sobre offsets, inventariar cada componente e limpar os n-days automaticamente, depois rodar sob emulação, abrir no radare2 e usar taint analysis para achar os caminhos source-to-sink que viram CVEs de verdade. Static-first, para que um chip SPI morto não te pare.", "t0402": "Aquisição, unpack &amp; o pipeline automatizado", "t0403": "Uma imagem de firmware é um container de containers: um header do fabricante, blobs comprimidos e um ou mais filesystems concatenados com padding e checksums. O trabalho do unpacker é achar o início <i>e<\/i> o fim de cada pedaço, extrair, descomprimir ou montar, e recursar. Acertar o offset de fim é o que separa as ferramentas modernas das antigas.", "t0404": "binwalk v3 e unblob<span class=\"lvl b\">básico<\/span>", "t0405": "o binwalk ganhou um <b>rewrite completo em Rust<\/b> (v3.1.0, ReFirmLabs, out. 2024): mesma memória muscular do <span class=\"mono\">binwalk -e<\/span> / <span class=\"mono\">-M<\/span> (recursão matryoshka), mais rápido, e ainda uma API de biblioteca. O <b>unblob<\/b> (ONEKEY) é a aposta em precisão: 78+ formatos, ele calcula o fim de cada chunk a partir da spec do formato, então não extrai a mais para dentro das árvores de falso-positivo pelas quais o binwalk é famoso, roda em sandbox e sem privilégios, e até corrigiu bugs de path-traversal nos extractors que ele aciona. Apele para o unblob quando a saída do binwalk virar uma bagunça.", "t0406": "Tire a parte chata da frente: SBOM e depois CVEs<span class=\"lvl i\">pipeline<\/span>", "t0407": "A revisão moderna é uma linha reta que dá pra scriptar: extrair, montar um Software Bill of Materials, mapear para CVEs conhecidos e só então reverter o que sobrou. O <b>syft<\/b> inventaria o rootfs em CycloneDX/SPDX; o <b>cve-bin-tool<\/b> (Intel, ~448 checkers) identifica versões de componentes <i>dentro<\/i> de binários stripados (OpenSSL, BusyBox, zlib, expat) e consulta NVD/OSV/outros. A passada de n-day roda sozinha, então seu tempo vai para as partes que um scanner não alcança.", "t0408": "EMBA, FACT, cwe_checker<span class=\"lvl i\">automatizado<\/span>", "t0409": "O <b>EMBA<\/b> (Michael Messner / Siemens Energy) orquestra todo o fluxo OWASP-FSTM: extração, análise estática, SBOM, agregação de CVEs, emulação de sistema e um relatório HTML navegável. Ele integra o <b>cwe_checker<\/b> (Fraunhofer FKIE), que eleva binários ARM/MIPS/PPC/x86 via Ghidra P-Code e sinaliza cerca de 18 classes de CWE (CWE-78 command injection, CWE-119/125/787 overflows, CWE-134 format string). O <b>FACT<\/b> acrescenta uma UI web cujo recurso marcante é fazer diff entre duas versões de firmware para achar patches silenciosos.", "t0410": "Imagem encriptada? A entropia manda você parar<span class=\"lvl i\">pulo do gato<\/span>", "t0411": "As duas ferramentas calculam entropia. Uma região estruturada entre 0.9 e 0.99 geralmente é compressão; próximo de ~1.0 uniforme no arquivo <i>inteiro<\/i>, sem headers de baixa entropia e sem nada extraível, é um blob de OTA cifrado ou assinado. O unblob acrescenta uma checagem qui-quadrado para tirar o chute. Quando você bate nessa parede, o unpacker de software cumpriu seu papel ao te dizer que só a extração não vai funcionar: pivote para UART/JTAG ou análise de bootloader para recuperar a chave ou um update em texto claro.", "t0412": "Extraia, inventarie cada componente num SBOM, mapeie versões automaticamente para CVEs conhecidas. Isso resolve os n-days de graça, então seu tempo de engenharia reversa vai pro que um scanner não alcança.", "t0413": "Entropia quase uniforme na imagem inteira significa criptografado ou comprimido. Uma queda é um header em plaintext ou um loader, e esse offset é onde um carve realmente funciona.", "t0414": "Header do kernel U-Boot (name/load addr lá dentro)", "t0415": "o rootfs, normalmente; xz/gzip/lzma por dentro", "t0416": "stream de kernel/rootfs puro", "t0417": "wrapper muito comum", "t0418": "rootfs gravável em NOR/NAND", "t0419": "Camada de volume NAND (ubifs dentro)", "t0420": "device tree, o mapa do hardware", "t0421": "container de kernel + ramdisk do Android", "t0422": "SaTC: 33 bugs pelo caminho extrair-depois-RE", "t0423": "Exatamente esse pipeline (extrair, depois rastrear as keywords de entrada até os sinks) é o que as ferramentas estáticas modernas automatizam, e ele produz bugs reais em escala.", "t0425": "CVE-2023-1389, command injection sem autenticação no campo <span class=\"mono\">country<\/span>, achada via extrair-e-reverter, mostrada no Pwn2Own Toronto 2022 e depois weaponizada pelo Mirai em semanas.", "t0426": "Emulação, rehosting &amp; fuzzing", "t0427": "Rehosting é rodar firmware sem o hardware dele, para você instrumentar, tirar snapshot e fazer fuzz em paralelo. O campo inteiro é uma briga entre fidelidade e velocidade, e se dividiu em duas linhas: rehosting de router/IoT Linux, e rehosting de MCU bare-metal, onde cada registrador de periférico precisa ser modelado.", "t0428": "QEMU user-mode vs full-system<span class=\"lvl b\">básico<\/span>", "t0429": "O <span class=\"mono\">qemu-user<\/span> roda um único ELF de Linux e traduz as syscalls dele para o seu host: rápido, mas sem filesystem real, NVRAM ou processos irmãos. O <span class=\"mono\">qemu-system<\/span> dá boot num kernel e rootfs inteiros, te entregando o ambiente real (nvram, o web server mais seu backend) ao custo de velocidade e de um kernel/DTB funcional. Regra de bolso: user-mode num único binário alcançável quando o bug mora dentro dele, vá full-system quando o código vulnerável depende de estado do device configurado em outro lugar.", "t0430": "FirmAE e Greenhouse para equipamentos Linux<span class=\"lvl i\">router/IoT<\/span>", "t0431": "O Firmadyne (2016) só conseguia bootar cerca de 16% das imagens. O <b>FirmAE<\/b> (ACSAC 2020) adiciona heurísticas de arbitragem (patchando boot, rede, NVRAM, kernel) e empurra isso para ~79% em 1.124 imagens, e achou 12 0-days em 23 dispositivos. Só que full-system é pesado, então o <b>Greenhouse<\/b> (USENIX Security 2023) rehospeda só <i>um<\/i> serviço em user space, reescrevendo o binário automaticamente para stubar <span class=\"mono\">nvram_get<\/span>, arquivos faltando e ioctls, e depois liga ao AFL++. Para um bug em um único binário web, normalmente é tudo que você precisa.", "t0432": "O problema dos periféricos de MCU<span class=\"lvl i\">bare-metal<\/span>", "t0433": "No Cortex-M não tem OS: o firmware mexe direto na I/O mapeada em memória, então um QEMU que retorna 0 para um registrador de status de UART deixa ele em busy-wait para sempre. Três respostas: o <b>HALucinator<\/b> (2020) casa funções da HAL do fabricante e troca por handlers em Python, de forma que o hardware \"some\"; o <b>P2IM<\/b> infere os papéis dos registradores a partir dos padrões de acesso; e o <b>Fuzzware<\/b> (USENIX 2022) trata cada leitura de MMIO desconhecida como entrada de fuzz e usa execução simbólica local para modelar quais bits de fato importam, para o fuzzer parar de gastar energia com bits don't-care.", "t0434": "Aí você acopla um fuzzer<span class=\"lvl i\">throughput<\/span>", "t0435": "Assim que rodar, aponte o <b>AFL++<\/b> para ele (qemu_mode, unicorn_mode, CmpLog, persistent mode). O <b>FirmAFL<\/b> foi pioneiro no híbrido full-system-mais-user para IoT Linux. E a corrida por throughput é real: o <b>SAFIREFUZZ<\/b> (USENIX 2023) roda firmware Cortex-M <i>nativamente<\/i> num host ARM via emulação de alto nível e binary rewriting, reportando mais de 600x o throughput do HALucinator. No canto exótico, o <b>FirmWire<\/b> (NDSS 2022) faz full-system-emulation de baseband Samsung e MediaTek e faz fuzzing da pilha celular, um alvo que antes era basicamente impossível de fuzzar.", "t0436": "Sob emulação, um fuzzer guiado por cobertura joga milhões de inputs e guarda os que chegam em código novo, salvando os crashes pra triagem. Sem dispositivo físico no loop, então escala.", "t0438": "Rehosting de Cortex-M auto-configurável via modelos automáticos de acesso a MMIO (Unicorn + AFL++). O baseline atual para fuzzing bare-metal automatizado.", "t0440": "Rehosting de serviço único em user-space via reescrita automática de binário, escalado no Kubernetes para rehostar e fuzzar grandes corpora de firmware.", "t0442": "Roda firmware Cortex-M como um processo nativo de userspace Linux via reescrita dinâmica de binário. Cerca de 600x o throughput do HALucinator.", "t0444": "Emulação full-system de baseband para modems Samsung e MediaTek, fuzzando a pilha de protocolo e achando memory corruption over-the-air.", "t0445": "Engenharia reversa com radare2", "t0446": "O radare2 brilha em firmware porque não assume nada: ele abre um blob MIPS/ARM cru e sem cabeçalho, recebe a arquitetura e o endereço base na linha de comando, analisa e emula uma função com ESIL, tudo sem o hardware. O fluxo que dura é sink-to-source, e o r2 moderno (5.9.x até 6.x) puxa decompiladores de verdade sob demanda.", "t0447": "Carregar um blob cru corretamente<span class=\"lvl b\">básico<\/span>", "t0448": "A habilidade de firmware mais importante de todas. Depois de um carve, conte tudo pro r2: <span class=\"mono\">r2 -a mips -b 32 -e cfg.bigendian=true -m 0x80000000 boot.bin<\/span>. Defina arch, tamanho de word, endianness (MIPS big-endian é a pegadinha clássica de router) e o endereço de map/base pra que ponteiros absolutos resolvam. Erre a arch e a análise vira lixo, então confira se strings, prólogos e xrefs batem. Instale com o <span class=\"mono\">sys/install.sh<\/span> do git, não com pacotes da distro (que ficam pra trás).", "t0449": "Passadas de análise e as cinco alavancas<span class=\"lvl b\">navegação<\/span>", "t0450": "O r2 não faz over-analyze por padrão. <span class=\"mono\">aaa<\/span> é o pass de sempre (ou rode <span class=\"mono\">aac<\/span>/<span class=\"mono\">aae<\/span>/<span class=\"mono\">aar<\/span> individualmente). Depois <span class=\"mono\">afl~name<\/span> lista funções, <span class=\"mono\">axt sym.imp.system<\/span> mostra quem chama um sink (a espinha dorsal do sink-to-source), <span class=\"mono\">pdf @ sym.foo<\/span> desmonta uma, <span class=\"mono\">izz~keyword<\/span> acha strings (use <span class=\"mono\">izz<\/span>, não <span class=\"mono\">iz<\/span>, em blobs crus), e <span class=\"mono\">VV<\/span> abre o control-flow graph.", "t0451": "ESIL, r2pipe e diffing<span class=\"lvl i\">nível acima<\/span>", "t0452": "Quando um valor é calculado, o ESIL emula uma função offline para resolvê-lo (<span class=\"mono\">aei; aeim; aeip; aes<\/span>, com <span class=\"mono\">e io.cache=true<\/span>), que é como você desempacota uma string de config ofuscada ou modela um checksum. O <b>r2pipe<\/b> automatiza a caçada inteira em Python: todo comando retorna JSON via <span class=\"mono\">cmdj()<\/span>, então você lista todos os callers de todos os sinks por todo um filesystem extraído. E <span class=\"mono\">radiff2 -A -C old new<\/span> faz diff no nível de função para reverter um patch ou achar um backdoor entre duas revisões de firmware.", "t0453": "Decompiladores e o ecossistema honesto<span class=\"lvl i\">ferramental<\/span>", "t0454": "Puxe decompiladores sob demanda: <span class=\"mono\">r2pm -Uci r2ghidra<\/span> te dá o <span class=\"mono\">pdg<\/span> (o decompilador de verdade do Ghidra como plugin, ótimo em MIPS/ARM), <span class=\"mono\">r2dec<\/span> te dá o <span class=\"mono\">pdd<\/span>. Em volta do r2 estão o Rizin e sua GUI Cutter, o <span class=\"mono\">analyzeHeadless<\/span> do Ghidra pra decompilar uma árvore inteira em lote, e o Binary Ninja. Novidade em 2024/2025: <b>r2ai<\/b> e <b>decai<\/b> adicionam decompilação assistida por LLM e dicas de vuln dentro do r2. Trate essa saída como hipótese, não como verdade.", "t0455": "TP-Link Archer AX21, em termos de r2", "t0456": "CVE-2023-1389: o parâmetro <span class=\"mono\">country<\/span> chega num <span class=\"mono\">popen()<\/span> como root. Sink-to-source de manual: ache o sink, ande com <span class=\"mono\">axt<\/span> de volta até o campo da request, confirme que não tem sanitizer.", "t0458": "Os plugins de LLM do radare de 2024/2025 trazem decompilação, explicação de função e dicas de vulnerabilidade para dentro do r2 via r2pm, apoiados em modelos OpenAI/Anthropic/Ollama/locais.", "t0459": "Caça a bugs automatizada: taint &amp; CVEs reais", "t0460": "Uma vulnerabilidade é um fato de fluxo de dados: input do atacante (uma source) chega a uma operação perigosa (um sink) sem sanitização. No Linux embarcado isso é um param HTTP ou valor de NVRAM fluindo para <span class=\"mono\">system()<\/span> (command injection) ou para <span class=\"mono\">strcpy()<\/span> sem bounds (overflow). Caçar bug é achar esse caminho contaminado, e as ferramentas modernas automatizam exatamente isso.", "t0461": "Comece pelo binário de borda<span class=\"lvl b\">básico<\/span>", "t0462": "O processo ligado à rede (o httpd ou um CGI handler) é por onde entra a entrada do atacante, então é aí que você começa. Faça grep dos sinks e ande para trás. Sinks: <span class=\"mono\">system/popen/execve<\/span> e wrappers do vendor como <span class=\"mono\">doSystem<\/span>/<span class=\"mono\">CsteSystem<\/span> (red flags, eles envelopam <span class=\"mono\">system()<\/span> com dados do device), mais <span class=\"mono\">strcpy/strcat/sprintf/memcpy<\/span>. Sources: <span class=\"mono\">websGetVar<\/span>, <span class=\"mono\">recv<\/span>, e leituras de config <span class=\"mono\">nvram_get<\/span>/<span class=\"mono\">nvram_safe_get<\/span>. A pergunta é sempre: algum argumento volta até uma source sem nenhum sanitizer no meio?", "t0463": "SaTC: keywords compartilhadas ligam o front-end ao binário<span class=\"lvl i\">taint<\/span>", "t0464": "O <b>SaTC<\/b> (USENIX Security 2021) percebeu que o mesmo nome de input aparece tanto no front-end web (uma string HTML/JS como <span class=\"mono\">\"ping_addr\"<\/span>) quanto no binário de back-end como uma string hardcoded usada para buscar aquele param. Ele extrai essas keywords compartilhadas de <span class=\"mono\">/www<\/span>, acha as referências delas no binário de borda com o Ghidra headless, e roda taint direcionado (<span class=\"mono\">ref2sink_cmdi<\/span>, <span class=\"mono\">ref2sink_bof<\/span>). Isso achou 33 bugs até então desconhecidos, na maioria command injection, incluindo o D-Link DIR-878.", "t0465": "KARONTE e EmTaint: os casos difíceis<span class=\"lvl i\">taint<\/span>", "t0466": "Firmware de verdade divide uma requisição entre processos: o httpd escreve um valor na NVRAM, um segundo binário lê e chama <span class=\"mono\">system()<\/span>. Taint de binário único perde isso. O <b>KARONTE<\/b> (IEEE S&amp;P 2020) modela o fluxo de dados multi-binário através de IPC por NVRAM/env/arquivo/socket. O <b>EmTaint<\/b> (ISSTA 2023) ataca o problema de aliasing em MIPS/ARM stripados com análise de alias sob demanda, rápido o bastante pra rodar imagens inteiras. Antes de qualquer um desses, o <b>cwe_checker<\/b> é uma primeira passada barata, e o <b>angr<\/b> prova alcançabilidade e resolve os bytes que disparam o bug.", "t0467": "De um hit a um achado confirmado<span class=\"lvl i\">triagem<\/span>", "t0468": "Um caminho estático é uma hipótese. Confirme quatro coisas: o handler é alcançável <b>pré-autenticação<\/b> (esses são os valiosos)? o código remove <span class=\"mono\">;|&amp;`$()<\/span> ou usa um allowlist entre source e sink? você consegue reproduzir fazendo rehosting do binário de borda e mandando a request? e um diff de versão mostra que o vendor corrigiu na surdina? Só um caminho que seja alcançável, sem sanitização e controlável é um bug de verdade.", "t0469": "O nome do parâmetro que um formulário envia também aparece como string no binário. O SaTC usa essa keyword compartilhada para fixar exatamente onde a entrada entra, e então a segue até um sink <span class=\"mono\">system()<\/span>. É assim que a caça a bugs estática ganha escala.", "t0470": "Firewalls Zyxel, RCE unauth", "t0471": "CVE-2023-28771: injeção de comando de SO sem autenticação, alcançável com um pacote IKE forjado para o UDP/500 no daemon IKE do firewall. CVSS 9.8, adicionado ao CISA KEV, explorado em massa por botnets.", "t0472": "D-Link NAS, injeção + backdoor", "t0473": "CVE-2024-3273: command injection no parâmetro <span class=\"mono\">system<\/span> do <span class=\"mono\">nas_sharing.cgi<\/span>, encadeada com uma conta backdoor hardcoded (CVE-2024-3272), nos DNS-320L/325/327L/340L em end-of-life.", "t0475": "Concurso de IoT de consumidor que caiu para essas mesmas cadeias de source-to-sink: NAS da WD e da QNAP, a câmera Synology BC500, impressoras Canon e Lexmark, e um Sonos Era 100.", "t0476": "toolkit do SaTC", "t0477": "Open source (NSSL-SJTU/SaTC): taint por keyword compartilhada com os scripts <span class=\"mono\">ref2sink_cmdi<\/span>/<span class=\"mono\">ref2sink_bof<\/span> que você pode rodar no seu próprio rootfs extraído.", "t0479": "Secure boot é uma cadeia de portões criptográficos, cada estágio verificando o próximo, ancorada numa chave fundida ou provisionada na plataforma. A safra de pesquisa de 2022 a 2025 despedaçou a ideia de que essa cadeia é inquebrável na prática. Isto é background para defensores e pesquisadores, não uma receita para atacar equipamento que não é seu.", "t0480": "A cadeia UEFI: PK, KEK, db, dbx<span class=\"lvl b\">básico<\/span>", "t0481": "O UEFI Secure Boot é uma política de assinaturas na NVRAM. A Platform Key (PK) é a raiz que autoriza mudanças nas Key Exchange Keys (KEK), que autorizam atualizações do <span class=\"mono\">db<\/span> (assinantes permitidos) e do <span class=\"mono\">dbx<\/span> (a lista de revogação). O firmware só roda um bootloader cuja assinatura encadeia até o <span class=\"mono\">db<\/span> e não está no <span class=\"mono\">dbx<\/span>. No Linux, as distros trazem o <b>shim<\/b> (assinado pela CA da Microsoft), que então confia no cert da distro mais as suas Machine Owner Keys (MOK). Audite a MOK com <span class=\"mono\">mokutil --list-enrolled<\/span>, porque é exatamente disso que os bootkits abusam.", "t0483": "O secure boot <b>impõe<\/b>: uma assinatura ruim interrompe o boot. O measured boot <b>registra<\/b>: cada estágio faz o hash do próximo num PCR de TPM mais um event log, e aí um verificador remoto decide via attestation. O measured boot não impede um bootkit, ele torna a mudança detectável depois do fato, e selar as chaves de disco aos PCRs (LUKS+TPM, BitLocker) amarra o acesso aos dados a uma cadeia não modificada. Leia os PCRs com <span class=\"mono\">tpm2_pcrread<\/span>.", "t0484": "Como a cadeia realmente quebrou, de 2023 a 2025<span class=\"lvl i\">classes de bypass<\/span>", "t0485": "O <b>BlackLotus<\/b> (2023) foi o primeiro bypass de UEFI Secure Boot visto in-the-wild, usando o \"baton drop\" (CVE-2022-21894) para tirar a policy da memória e trazendo seus próprios binários assinados-mas-vulneráveis. O <b>Bootkitty<\/b> (nov 2024) foi o primeiro bootkit UEFI mirando Linux (um PoC de pesquisa). O <b>LogoFAIL<\/b> (2023) transformou o parser da imagem do boot-logo em execução de código durante o DXE, sem tocar em nenhum executável assinado. O padrão: um arquivo de dados não assinado, um binário vazado ou um bug de parser vence a cripto.", "t0486": "Quando a root of trust é falsa<span class=\"lvl i\">supply chain<\/span>", "t0487": "O <b>PKfail<\/b> (Binarly, 2024) descobriu que em mais de 800 modelos de dispositivo a Platform Key era uma chave de <i>teste<\/i> da AMI cujo certificado literalmente diz \"DO NOT TRUST\", com algumas metades privadas vazadas publicamente, então qualquer um podia assinar uma atualização confiável. O vazamento da MSI em 2023 expôs de forma parecida chaves OEM do Intel Boot Guard. A segurança de boot criptográfica só vale o quanto vale a gestão de chaves ao longo de uma longa cadeia OEM/ODM. No ARM embarcado as mesmas ideias aparecem como U-Boot FIT verified boot, Android AVB e o TBBR do TF-A ancorado a um hash de ROTPK em fuses, e falham do mesmo jeito quando uma chave vaza, os fuses não são queimados em produção, ou falta proteção contra rollback.", "t0488": "Cada estágio verifica o próximo, ancorado a uma chave no silício. Os ataques batem no elo mais fraco: um arquivo de dados sem assinatura (LogoFAIL), uma chave vazada (PKfail), um binário assinado mas vulnerável (BlackLotus), ou um glitch na verificação.", "t0490": "Primeiro bootkit in-the-wild a burlar o UEFI Secure Boot. Remove a policy da memória via <span class=\"mono\">truncatememory<\/span> no BCD (CVE-2022-21894) e cadastra o próprio certificado MOK. A correção da Microsoft (KB5025885) faseou as revogações do dbx porque revogar automaticamente arrisca brickar.", "t0492": "Memory corruption em parsers de imagem de boot-logo UEFI na Insyde, AMI e Phoenix. Um logo não assinado roda código durante o DXE, burlando o Secure Boot sem tocar em nenhum executável assinado.", "t0494": "Mais de 800 modelos saíram de fábrica com uma Platform Key de teste da AMI marcada como \"DO NOT TRUST\", algumas com a chave privada pública. A própria raiz de confiança era forjável. Cheque a sua em pk.fail.", "t0495": "BootHole, o caso de origem", "t0496": "CVE-2020-10713: um buffer overflow ao parsear o arquivo de texto <i>não assinado<\/i> <span class=\"mono\">grub.cfg<\/span> executa código com bypass do Secure Boot. O modelo de \"config/dados no caminho confiável são superfície de ataque\".", "t0497": "Análise dinâmica, metodologia &amp; disclosure", "t0498": "Tudo além da revisão estática do filesystem é dinâmico: operar um device real ou emulado, interceptar seu plano de gerência e colocar um debugger nele. Rode contra uma metodologia pra ser repetível, e termine com um report em que o vendor consiga de fato agir.", "t0499": "OWASP FSTM como um checklist que você roda<span class=\"lvl b\">básico<\/span>", "t0500": "A Firmware Security Testing Methodology tem nove estágios ordenados: recon, obter o firmware, analisar, extrair o filesystem, analisar o conteúdo, emular, análise dinâmica, análise em runtime, exploração. Os estágios 1 a 5 são estáticos; a graça do 6 ao 9 é que eles te tiram do disco e te jogam num alvo em execução. Trate cada estágio como um portão com um artefato concreto (um emulador dando boot, uma sessão web autenticada, um debugger anexado), não como uma sensação.", "t0501": "Intercepte o plano de gerenciamento<span class=\"lvl i\">onde estão os bugs<\/span>", "t0502": "Faça proxy da UI web pelo Burp ou mitmproxy e mapeie cada CGI escondido. Em equipamentos derivados do OpenWrt o plano de config é o <span class=\"mono\">ubus<\/span> (JSON-RPC) e o <span class=\"mono\">uci<\/span>: de um shell, tente <span class=\"mono\">ubus list<\/span>, <span class=\"mono\">ubus call system board<\/span>, e confira as ACLs em <span class=\"mono\">/usr/share/rpcd/acl.d/<\/span>. Sobre HTTP, o plugin ubus do uhttpd exige login e ACL, então o bug está no manejo fraco de sessão. Pra telemetria, assine o broker com <span class=\"mono\">mosquitto_sub -t '#'<\/span> e sonde CoAP em UDP/5683.", "t0503": "O app companheiro é um atalho<span class=\"lvl i\">mobile<\/span>", "t0504": "O app costuma ser o jeito mais rápido de entender um protocolo proprietário e a API de cloud. Decompile o APK com <span class=\"mono\">jadx<\/span>, extraia endpoints e chaves hardcoded, e use <b>Frida<\/b> pra hookar TLS e cripto em runtime, burlando cert pinning e dumpando o BLE/HTTP/MQTT em texto claro em que o device realmente confia. Depois reproduza isso direto contra o device ou a API dele pra testar os limites de autorização.", "t0505": "Ponha um debugger nele e faça fuzz do protocolo<span class=\"lvl i\">runtime<\/span>", "t0506": "Com um shell, cross-compile um <span class=\"mono\">gdbserver<\/span> compatível, rode <span class=\"mono\">gdbserver :1234 --attach &lt;pid&gt;<\/span>, e conecte com <span class=\"mono\">gdb-multiarch<\/span> mais GEF ou pwndbg. Sem shell mas com pads expostos, faça ponte do OpenOCD para o gdb via JTAG. Uma vez que você conhece o protocolo, fuzze ele com <b>boofuzz<\/b> sobre TCP/UDP, junto de um monitor de liveness para que um hang conte como falha. Case a endianness exatamente (mipsel vs mips).", "t0507": "Escale, depois divulgue<span class=\"lvl i\">o entregável<\/span>", "t0508": "Pra um portfólio, plugue o <b>EMBA<\/b> (e seu front-end de time, o EMBArk) no CI pra que todo build seja escaneado e diffado; plataformas comerciais como a <b>ONEKEY<\/b> fazem SBOM de binário e casamento de CVE contínuos. Depois feche o ciclo: divulgação coordenada (CISA CVD, ISO 29147/30111), um CVE do CNA certo, e um report com a versão afetada exata e o hash, o arquivo e a função, o CWE, um PoC reproduzível, um vetor CVSS, pré-condições, impacto e remediação. Anexe o SBOM e seus passos de emulação pra que o fornecedor reproduza sem o seu setup.", "t0509": "o portão de evidência", "t0510": "<b>Binário + função + endereço.<\/b> Aponte pra ele.", "t0511": "<b>O caminho alcançável<\/b>, source até sink, pré-auth ou não.", "t0512": "<b>A instrução com defeito<\/b>, citada direto do disassembly.", "t0513": "<b>Posição do atacante + impacto + um PoC reproduzível.<\/b>", "t0514": "duas armadilhas de reteste", "t0515": "<b>Recompilado ≠ corrigido.<\/b> Faça o hash do material vulnerável (a chave, o <span class=\"mono\">n<\/span>/<span class=\"mono\">d<\/span> do RSA), não do ELF.", "t0516": "<b>Reteste contra a produção, não a beta.<\/b> Rode <span class=\"mono\">radiff2<\/span> nos dois e ancore o report onde os usuários estão.", "t0517": "trabalhe a metodologia, não o feeling", "t0518": "Três achados sólidos e reproduzíveis valem mais que vinte talvez, e um limpo \"chequei, está limitado\" merece ser anotado. Cace como se um segundo você estivesse tentando matar cada achado: a chave \"secreta\" acaba sendo derivável, a cópia \"sem limite\" tem teto, o input não é controlado pelo atacante. O que sobreviver a isso é real.", "t0312": "<b>Jogue limpo.<\/b> Faça isso em hardware que é seu, ou dentro de um programa autorizado / escopo de divulgação coordenada. Meça antes de conectar, faça backup antes de escrever, e trate a rede elétrica, o lítio, e equipamento de glitch de alta tensão como perigos que podem machucar <i>você<\/i>, não só a placa. Extraia os segredos e reporte, não use eles. Reporte pro fabricante e segure os detalhes até eles terem uma janela justa. O ofício depende de você continuar sendo o tipo de pesquisador com quem os fabricantes seguem conversando.", "t0313": "<b>escopo:<\/b> bancada → dump → unpack → emular → desmontar → caçar", "t0314": "<b>método:<\/b> static-first · radare2 · pesquisado na web · fact-checked", "t0520": "como usar isto", "t0521": "As seções <b>09-10<\/b> (glitching, side-channel) e <b>13/15<\/b> (rehosting, taint) são de nível intermediário pra cima, não é coisa do primeiro dia. Primeira placa: rode <b>01-06 + 12 + 14<\/b>, tire um dump limpo e um bug simples de command-injection, e depois volte pro resto.", "t0522": "<b>Out of scope:<\/b> aqui é extração e análise de firmware por fio. RF/SDR, Wi-Fi e BLE ficam de fora, exceto arrancar segredos do app companion.", "t0523": "Travou? Pule pro conserto", "t0524": "Ache seu sintoma, clique até chegar no bloco \"quando dá errado\" daquela seção.", "t0525": "Bancada &amp; extração", "t0526": "A leitura SPI é toda 0xFF, ou muda a cada dump", "t0528": "Detectado, mas apagar/gravar falha ou verifica o valor antigo", "t0529": "Esse chip é 1.8V? (e por que um CH341A não consegue ler)", "t0530": "UART cospe lixo", "t0531": "A UART está totalmente muda", "t0532": "U-Boot não para no autoboot", "t0533": "Shell root, mas rootfs read-only / sem ferramentas", "t0534": "A placa dá brownout / o limite de corrente dispara", "t0535": "eMMC não enumera no leitor SD", "t0536": "eMMC mostra só uma partição", "t0537": "Dump de NAND cru é só ruído", "t0538": "Pads JTAG sem rótulo", "t0539": "O IDCODE lê, mas a memória vem zerada / dá fault", "t0540": "Solda não pega / BGA empena no chip-off", "t0541": "Firmware &amp; análise", "t0542": "binwalk inunda de falso positivo / extrai demais", "t0543": "Entropia chapada em ~1.0 na imagem inteira", "t0544": "O disassembly do radare2 vem lixo", "t0545": "Não acha onde um parâmetro web é tratado", "t0546": "Achou system()/popen(), é um bug?", "t0547": "httpd escreve na NVRAM, outro binário lê", "t0548": "Emulação do roteador não dá boot", "t0549": "O firmware do MCU trava pra sempre no QEMU", "t0550": "O fabricante consertou de verdade?", "t0551": "Quando dá errado", "t0552": "<b class=\"sy\">A placa dá brownout, ou o limite de corrente da fonte dispara no instante em que você encosta a ponta de prova.<\/b> <span class=\"cau\"><b>Causa:<\/b> um curto (ponte de solda, componente invertido), ou você está medindo uma fonte da rede sem isolamento.<\/span> <b>Jogada:<\/b> deixe o limite de corrente baixo e suba devagar, assim um curto dispara o modo CC em vez de fritar uma trilha; se a tensão despencar, corte a energia e ache o curto. <span class=\"warn\">⚠ nunca meça o lado da rede de uma placa sem isolamento, o \"terra\" dela pode estar no potencial da linha.<\/span>", "t0553": "Quando dá errado", "t0554": "<b class=\"sy\">Não tem certeza se um pad é UART.<\/b> <span class=\"cau\"><b>Causa:<\/b> um multímetro mostra níveis de idle, não tráfego.<\/span> <b>Jogada:<\/b> põe um logic analyzer nele e deixa o sigrok decodificar: UART de verdade vira ASCII em algum baud, e o TX mostra uma rajada densa no power-on. <span class=\"saver\">⏱ confirma isso antes de você soldar qualquer coisa<\/span>", "t0555": "<b class=\"sy\">Leituras de resistência ou continuidade parecem sem sentido numa placa energizada.<\/b> <span class=\"cau\"><b>Causa:<\/b> esses modos injetam a própria corrente, um trilho energizado corrompe elas.<\/span> <b>Jogada:<\/b> meça tensão com a placa ligada, todo o resto com a placa desligada. Resistência in-circuit é só uma pista (\"preso firme num trilho ou não\"), nunca um valor real.", "t0556": "Quando dá errado", "t0557": "<b class=\"sy\">A solda não pega, a junta briga com você.<\/b> <span class=\"cau\"><b>Causa:<\/b> pouco fluxo, ou uma ponta com pouca massa térmica.<\/span> <b>Jogada:<\/b> ponha fluxo (não force a temperatura pra cima), use uma ponta chata, esquente o pad e o terminal juntos, alimente a solda dentro da junta. Em lead-free uma junta boa fica fosca, então avalie pelo formato do filete, não pelo brilho.", "t0558": "<b class=\"sy\
