{%- assign u = page.url -%}
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="{{ '/' | relative_url }}">
      t1m3<span class="tld">· gatonet.club</span>
    </a>
    <nav aria-label="principal">
      <a href="{{ '/' | relative_url }}"{% if u == '/' %} aria-current="page"{% endif %}>home</a>
      <a href="{{ '/papers/' | relative_url }}"{% if u contains '/papers' %} aria-current="page"{% endif %}>papers</a>
      <a href="{{ '/pgp/' | relative_url }}"{% if u contains '/pgp' %} aria-current="page"{% endif %}>pgp</a>
      <a href="{{ '/about/' | relative_url }}"{% if u contains '/about' %} aria-current="page"{% endif %}>about</a>
    </nav>
    <span class="spacer"></span>
    <button class="tgl" id="langToggle" type="button" aria-label="idioma / language" title="português / english">
      <span aria-hidden="true">⇄</span><b id="langLabel">PT</b>
    </button>
    <button class="tgl" id="themeToggle" type="button" aria-label="alternar tema" title="alternar tema">
      <span id="themeIcon">◑</span><b id="themeLabel">auto</b>
    </button>
  </div>
</header>
